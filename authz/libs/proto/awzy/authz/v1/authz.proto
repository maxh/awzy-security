syntax = "proto3";

// The decision API every enforcement point (gateway, SDKs, Envoy filter) calls.
package awzy.authz.v1;

import "awzy/authz/v1/qid.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service Authorizer {
  // Decides one action by one principal on one resource: allow, deny, or challenge.
  rpc Check(CheckRequest) returns (CheckResponse);
  // Waits, up to `wait_secs`, for a challenge a check opened to be answered (ADR 0111): for an
  // agent with no person in its session, which retries once it's passed. Only the principal the
  // challenge was opened for, with the same person, gets an answer; for anyone else it isn't
  // found. The grant stays in awzy, so the caller never holds anything it could replay.
  rpc WaitForChallenge(WaitForChallengeRequest) returns (WaitForChallengeResponse);
  // The apps an admin trusts to sign tokens for their own agents (ADR 0110), besides the client's
  // IdP. Enforcement points accept their tokens only for service accounts under each one's prefix.
  rpc ListTrustedIssuers(ListTrustedIssuersRequest) returns (ListTrustedIssuersResponse);
}

// A typed reference to a world-model entity, e.g. type "Human", id "alice".
message EntityRef {
  string type = 1;
  string id = 2;
}

// Who did something (ADR 0060): a person (type "Human", the IdP's ID), a service account or one of
// awzy's services ("AwzyService", e.g. "awzy-reasoner"), a break-glass key ("BreakGlassKey", its
// fingerprint), awzy staff in the corp portal ("AwzyStaff"), or an app that signs tokens for its own
// agents ("App", by name); and the person it acted for, when it acted for one.
message Actor {
  EntityRef subject = 1;
  EntityRef on_behalf_of = 2;
}

// An entity the enforcement point already knows about, in Cedar's entity shape.
// Sent inline until the PDP's attribute snapshot covers it.
message Entity {
  EntityRef uid = 1;
  google.protobuf.Struct attrs = 2;
  repeated EntityRef parents = 3;
}

message CheckRequest {
  // The principal: who is acting, a Human or a ServiceAccount.
  EntityRef principal = 1;
  // What they are doing, e.g. "read".
  string action = 2;
  // What they are doing it to.
  EntityRef resource = 3;
  // Request context, e.g. {"risk_score": 12}. Must match the Cedar schema for the action.
  // The keys on_behalf_of and human_present are set by the PDP from the fields below and
  // are rejected here.
  google.protobuf.Struct context = 4;
  // When a service account acts for a person (from a validated RFC 8693 token), that person.
  // The PDP allows the request only if the person could do it too.
  EntityRef on_behalf_of = 5;
  repeated Entity entities = 6;
  // Whether a person is there to answer a challenge. Unset: true for a Human principal,
  // false for a service account.
  optional bool human_present = 7;
  // The enforcement point applies this verdict whatever the install's mode, and the decision
  // is recorded as enforced. The client portal does this for its own access (ADR 0020).
  bool always_enforced = 8;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_ALLOW = 1;
  VERDICT_DENY = 2;
  VERDICT_CHALLENGE = 3;
}

enum ChallengeKind {
  CHALLENGE_KIND_UNSPECIFIED = 0;
  CHALLENGE_KIND_JUSTIFICATION = 1;
  CHALLENGE_KIND_VERIFICATION = 2;
  CHALLENGE_KIND_APPROVAL = 3;
  CHALLENGE_KIND_BIOMETRIC = 4;
}

// Whether the enforcement point applies the verdict (ADR 0007).
enum EnforcementMode {
  ENFORCEMENT_MODE_UNSPECIFIED = 0;
  // Record only: the enforcement point MUST allow, and must not send challenges. The verdict is
  // what would have happened.
  ENFORCEMENT_MODE_MONITOR = 1;
  // Apply the verdict.
  ENFORCEMENT_MODE_ENFORCE = 2;
}

message CheckResponse {
  // QID: decision_<uuid>, time-ordered (UUIDv7). Used to explain the decision later.
  string decision_qid = 1 [(awzy.authz.v1.qid) = "decision"];
  Verdict verdict = 2;
  // Set when verdict is VERDICT_CHALLENGE: every one must be passed.
  repeated ChallengeKind challenges = 3;
  // Policies that determined the principal's own check.
  repeated string policies = 4;
  // For a delegated request: the person's own check. The verdict above is the stricter of the two.
  DelegationCheck on_behalf_of = 5;
  // MONITOR: allow regardless of the verdict. An enforcement point that doesn't understand this
  // field applies the verdict, which fails safe.
  EnforcementMode mode = 6;
  // For an enforced challenge: the challenge opened in awzy-challenge (QID: challenge_<uuid>). The
  // person answers it, then the caller retries the same request. Empty when none could be opened.
  string challenge_qid = 7 [(awzy.authz.v1.qid) = "challenge"];
}

message DelegationCheck {
  Verdict verdict = 1;
  repeated ChallengeKind challenges = 2;
  repeated string policies = 3;
}

message WaitForChallengeRequest {
  // QID: challenge_<uuid>, from CheckResponse.challenge_qid.
  string challenge_qid = 1 [(awzy.authz.v1.qid) = "challenge"];
  // The check's principal and the person it acted for, as the enforcement point validated them.
  EntityRef principal = 2;
  EntityRef on_behalf_of = 3;
  // How long to wait for an answer before replying PENDING: 0 to look without waiting, at most 25.
  uint32 wait_secs = 4;
}

// What became of a challenge.
enum ChallengeOutcome {
  CHALLENGE_OUTCOME_UNSPECIFIED = 0;
  // Still waiting for the person: ask again.
  CHALLENGE_OUTCOME_PENDING = 1;
  // Passed: retry the same request, before `grant_expires_at`.
  CHALLENGE_OUTCOME_PASSED = 2;
  // An approver said no: the request is denied until `expires_at`. Don't retry.
  CHALLENGE_OUTCOME_REJECTED = 3;
  // Not answered in time: a retry opens a new challenge.
  CHALLENGE_OUTCOME_EXPIRED = 4;
}

message WaitForChallengeResponse {
  ChallengeOutcome outcome = 1;
  // Pending: when it expires unanswered. Rejected: when the request stops being denied.
  google.protobuf.Timestamp expires_at = 2;
  // Passed: until when a retry is allowed.
  google.protobuf.Timestamp grant_expires_at = 3;
  // Pending: the kinds still to be passed.
  repeated ChallengeKind pending = 4;
}

message ListTrustedIssuersRequest {}

message ListTrustedIssuersResponse {
  repeated TrustedIssuer issuers = 1;
}

// An app that signs tokens for its own agents.
message TrustedIssuer {
  // The app's name, the `sub` of the tokens it signs for itself, e.g. "acme-crm".
  string name = 1;
  // The `iss` its tokens carry.
  string issuer = 2;
  // Where its signing keys are published (RS256 or ES256).
  string jwks_url = 3;
  // The `aud` its tokens must carry.
  string audience = 4;
  // It signs tokens only for service accounts whose ID starts with this, e.g. "acme-crm.".
  string agent_prefix = 5;
}
