syntax = "proto3";

// Versioned Cedar policy bundles: the client portal writes them, every PDP reads the active one.
package awzy.policy.v1;

import "awzy/authz/v1/authz.proto";
import "awzy/authz/v1/qid.proto";
import "google/protobuf/timestamp.proto";

service PolicyService {
  // Validates the bundle against its schema and stores it as a draft.
  rpc CreateDraft(CreateDraftRequest) returns (CreateDraftResponse);
  // Makes a draft the active bundle; the previous active bundle becomes superseded.
  rpc Publish(PublishRequest) returns (PublishResponse);
  // The active bundle, or `unchanged` when the caller already has that version.
  rpc GetActive(GetActiveRequest) returns (GetActiveResponse);
  rpc ListBundles(ListBundlesRequest) returns (ListBundlesResponse);
  // One bundle by ID or version, e.g. the bundle a logged decision was made under.
  rpc GetBundle(GetBundleRequest) returns (GetBundleResponse);

  // Enforcement modes (ADR 0007). A scope with no recorded change is in monitor.
  rpc GetEnforcement(GetEnforcementRequest) returns (GetEnforcementResponse);
  rpc SetEnforcement(SetEnforcementRequest) returns (SetEnforcementResponse);
  // Every switch of a scope, newest first.
  rpc ListEnforcementChanges(ListEnforcementChangesRequest) returns (ListEnforcementChangesResponse);
  // The current setting of every action and tool scope that has been switched (ADR 0109).
  rpc ListEnforcementSettings(ListEnforcementSettingsRequest) returns (ListEnforcementSettingsResponse);

  // What enforcement points do while the PDP is unreachable (ADR 0089): each MCP tool's tier and
  // which tiers fail open. Never set means every tool is unclassified and everything fails closed.
  rpc GetOutageFallback(GetOutageFallbackRequest) returns (GetOutageFallbackResponse);
  rpc SetOutageFallback(SetOutageFallbackRequest) returns (SetOutageFallbackResponse);
  // The model routing (ADR 0114): which models Awzy Bot and investigations use. The client portal
  // sets it; the portal and awzy-reasoner follow it.
  rpc GetModelRouting(GetModelRoutingRequest) returns (GetModelRoutingResponse);
  rpc SetModelRouting(SetModelRoutingRequest) returns (SetModelRoutingResponse);

  // Break-glass: republishes an earlier bundle when a bad one locks admins out. Authenticated by
  // a signature from a key enrolled at install time, not by the IdP or the PDP, so it works when
  // either is what's broken. Every use is recorded.
  rpc BreakGlassRollback(BreakGlassRollbackRequest) returns (BreakGlassRollbackResponse);
}

enum BundleStatus {
  BUNDLE_STATUS_UNSPECIFIED = 0;
  BUNDLE_STATUS_DRAFT = 1;
  BUNDLE_STATUS_ACTIVE = 2;
  BUNDLE_STATUS_SUPERSEDED = 3;
}

message PolicyBundle {
  // QID: policy_bundle_<uuid>.
  string qid = 1 [(awzy.authz.v1.qid) = "policy_bundle"];
  // Increases with every bundle created. PDPs report the version they enforce.
  int64 version = 2;
  // Cedar schema (human-readable format).
  string schema = 3;
  // Cedar policies.
  string policies = 4;
  BundleStatus status = 5;
  // Deprecated: use `created_by_actor`, which this repeats as text (`Human::alice`).
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  // Deprecated: use `published_by_actor`, which this repeats as text (`Human::alice`).
  string published_by = 8;
  google.protobuf.Timestamp published_at = 9;
  // ECDSA P-256 signature (DER) over the payload defined in awzy-signing, set when published.
  // PDPs verify it before loading the bundle.
  bytes signature = 10;
  // Which key signed it: `sha256:<fingerprint>` of the public key.
  string signing_key_id = 11;
  // Who created it (ADR 0060).
  awzy.authz.v1.Actor created_by_actor = 12;
  // Who published it (ADR 0060).
  awzy.authz.v1.Actor published_by_actor = 13;
}

message CreateDraftRequest {
  string schema = 1;
  string policies = 2;
  // Deprecated: use `created_by_actor`, which this repeats as text (`Human::alice`).
  string created_by = 3;
  // Who created it (ADR 0060).
  awzy.authz.v1.Actor created_by_actor = 4;
}

message CreateDraftResponse {
  PolicyBundle bundle = 1;
}

message PublishRequest {
  // QID: policy_bundle_<uuid>.
  string policy_bundle_qid = 1 [(awzy.authz.v1.qid) = "policy_bundle"];
  // Deprecated: use `published_by_actor`, which this repeats as text (`Human::alice`).
  string published_by = 2;
  // Who published it (ADR 0060).
  awzy.authz.v1.Actor published_by_actor = 3;
}

message PublishResponse {
  PolicyBundle bundle = 1;
}

message GetActiveRequest {
  // The version the caller enforces now; 0 if none.
  int64 known_version = 1;
  // When the active bundle is `known_version`, wait up to this many seconds (at most 25) for a
  // new one or a change of enforcement mode before answering `unchanged` (ADR 0077). 0 answers
  // at once.
  uint32 wait_seconds = 2;
}

message GetActiveResponse {
  // Unset when there is no active bundle or when `unchanged` is true.
  PolicyBundle bundle = 1;
  bool unchanged = 2;
}

message ListBundlesRequest {
  // Newest first. Defaults to 50, at most 500.
  int32 limit = 1;
}

message ListBundlesResponse {
  repeated PolicyBundle bundles = 1;
}

message GetBundleRequest {
  oneof key {
    // QID: policy_bundle_<uuid>.
    string policy_bundle_qid = 1 [(awzy.authz.v1.qid) = "policy_bundle"];
    int64 version = 2;
  }
}

message GetBundleResponse {
  PolicyBundle bundle = 1;
}

message EnforcementSetting {
  // "install", "automated-containments" (ADR 0066), "action:<action>", or "tool:<server>/<tool>"
  // (ADR 0109). A check takes the mode of the most specific switched scope: its tool's, then its
  // action's, then the install's.
  string scope = 1;
  awzy.authz.v1.EnforcementMode mode = 2;
  // Empty, with no changed_at, when the scope has never been switched.
  // Deprecated: use `changed_by_actor`, which this repeats as text (`Human::alice`).
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
  // Who changed it (ADR 0060).
  awzy.authz.v1.Actor changed_by_actor = 5;
  // ECDSA P-256 signature (DER) over awzy-signing's enforcement_payload, set when awzy-policy has
  // a signing key (ADR 0080). Empty for a scope never switched, which is in monitor.
  bytes signature = 6;
  // The key that signed: `sha256:<fingerprint>`.
  string signing_key_id = 7;
}

message GetEnforcementRequest {
  // Defaults to "install".
  string scope = 1;
}

message GetEnforcementResponse {
  EnforcementSetting setting = 1;
}

message SetEnforcementRequest {
  // Defaults to "install".
  string scope = 1;
  awzy.authz.v1.EnforcementMode mode = 2;
  // Deprecated: use `changed_by_actor`, which this repeats as text (`Human::alice`).
  string changed_by = 3;
  // Who changed it (ADR 0060).
  awzy.authz.v1.Actor changed_by_actor = 4;
}

message SetEnforcementResponse {
  EnforcementSetting setting = 1;
}

message ListEnforcementChangesRequest {
  // Defaults to "install".
  string scope = 1;
  // Defaults to 20, at most 200.
  int32 limit = 2;
}

message ListEnforcementChangesResponse {
  repeated EnforcementSetting changes = 1;
}

message ListEnforcementSettingsRequest {}

message ListEnforcementSettingsResponse {
  // Each switched action or tool scope's latest change, signed as any switch is (ADR 0080).
  repeated EnforcementSetting settings = 1;
}

message BreakGlassRollbackRequest {
  // The version to restore. 0: the bundle published before the active one.
  int64 to_version = 1;
  // Unix seconds. Requests more than 5 minutes old or ahead are refused.
  int64 requested_at_unix = 2;
  // Unique per request; a nonce can only be used once.
  string nonce = 3;
  // Why. Recorded with the event and signed, so it can't be changed in transit.
  string reason = 4;
  // ECDSA P-256 signature (DER) over awzy-signing's break_glass_payload.
  bytes signature = 5;
  // The enrolled key that signed: `sha256:<fingerprint>`.
  string key_id = 6;
}

message BreakGlassRollbackResponse {
  // The new active bundle: a copy of the restored version, signed as usual.
  PolicyBundle bundle = 1;
  int64 restored_version = 2;
  // The version that was active before; 0 if none.
  int64 replaced_version = 3;
}

// An outage fallback setting (ADR 0089). awzy-gateway uses its tiers for every check, and its
// fail-open tiers while the PDP is unreachable.
message OutageFallback {
  // Increases with every change; 0 when never set.
  int64 version = 1;
  // Each classified tool's tier (public, internal, confidential, crown_jewels), by
  // `<server>/<tool>`.
  map<string, string> tools = 2;
  // The tier of a server's tools not listed in `tools`, by server name. During an outage those
  // fail closed anyway.
  map<string, string> servers = 3;
  // Tiers whose listed tools may replay a recent allow during an outage. Never confidential or
  // crown_jewels.
  repeated string fail_open_tiers = 4;
  // Who set it (ADR 0060); unset when never set.
  awzy.authz.v1.Actor changed_by_actor = 5;
  google.protobuf.Timestamp changed_at = 6;
  // ECDSA P-256 signature (DER) over awzy-signing's fallback_payload, set when awzy-policy has a
  // signing key.
  bytes signature = 7;
  // The key that signed: `sha256:<fingerprint>`.
  string signing_key_id = 8;
}

message GetOutageFallbackRequest {
  // The version the caller has; 0 if none.
  int64 known_version = 1;
}

message GetOutageFallbackResponse {
  // Unset when `unchanged` is true.
  OutageFallback fallback = 1;
  bool unchanged = 2;
}

message SetOutageFallbackRequest {
  map<string, string> tools = 1;
  map<string, string> servers = 2;
  repeated string fail_open_tiers = 3;
  // Who is setting it (ADR 0060).
  awzy.authz.v1.Actor changed_by_actor = 4;
}

message SetOutageFallbackResponse {
  OutageFallback fallback = 1;
}

// A model routing setting (ADR 0114): the catalog of models and each feature's route.
message ModelRouting {
  // Increases with every change; 0 when never set, and then each service keeps the routing its
  // deploy configuration started it with.
  int64 version = 1;
  // awzy_llm::Routing, as JSON: kept as text so the catalog's specs can gain fields without a
  // change here. Signed as these bytes.
  string routing_json = 2;
  // Who set it (ADR 0060); unset when never set.
  awzy.authz.v1.Actor changed_by_actor = 3;
  google.protobuf.Timestamp changed_at = 4;
  // ECDSA P-256 signature (DER) over awzy-signing's model_routing_payload, set when awzy-policy
  // has a signing key.
  bytes signature = 5;
  // The key that signed: `sha256:<fingerprint>`.
  string signing_key_id = 6;
}

message GetModelRoutingRequest {
  // The version the caller has; 0 if none.
  int64 known_version = 1;
}

message GetModelRoutingResponse {
  // Unset when `unchanged` is true.
  ModelRouting routing = 1;
  bool unchanged = 2;
}

message SetModelRoutingRequest {
  // awzy_llm::Routing, as JSON. The portal checks it against the install's connections first.
  string routing_json = 1;
  // Who is setting it (ADR 0060).
  awzy.authz.v1.Actor changed_by_actor = 2;
}

message SetModelRoutingResponse {
  ModelRouting routing = 1;
}
