syntax = "proto3";

// Challenges and containments (awzy-challenge). The PDP resolves challenges and follows the
// containment feed; the client portal answers challenges and manages containments.
package awzy.challenge.v1;

import "awzy/authz/v1/authz.proto";
import "google/protobuf/timestamp.proto";

service ChallengeService {
  // Called by the PDP on an enforced challenge verdict: which of the required kinds this exact
  // request has already passed, and, with `open`, the pending challenge for the rest.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  rpc GetChallenge(GetChallengeRequest) returns (GetChallengeResponse);
  // Newest first.
  rpc ListChallenges(ListChallengesRequest) returns (ListChallengesResponse);
  // Answers a justification challenge. Only the person the challenge was sent to can.
  rpc Justify(JustifyRequest) returns (JustifyResponse);
  // Approves or rejects an approval challenge. The approver must be someone else whom the PDP
  // allows to `approve` the resource.
  rpc Decide(DecideRequest) returns (DecideResponse);

  // Revokes an accessor's access until the containment is lifted, or with `monitor` records that
  // it would have (ADR 0066). Idempotent: containing an accessor who is already contained in
  // that mode returns the active containment.
  rpc Contain(ContainRequest) returns (ContainResponse);
  rpc Lift(LiftRequest) returns (LiftResponse);
  // Newest first.
  rpc ListContainments(ListContainmentsRequest) returns (ListContainmentsResponse);
  // The active containments, for a PDP: the whole list on connect and on every change, and a
  // heartbeat in between, so a PDP knows when its copy may be stale.
  rpc WatchContainments(WatchContainmentsRequest) returns (stream WatchContainmentsResponse);

  // Security keys (WebAuthn, ADR 0059). Each Begin returns a single-use ceremony and the options
  // for the browser's navigator.credentials call; the matching Finish takes its response.
  rpc ListSecurityKeys(ListSecurityKeysRequest) returns (ListSecurityKeysResponse);
  // For someone who already has a key: an assertion ceremony that authorizes adding or removing
  // one.
  rpc BeginKeyChange(BeginKeyChangeRequest) returns (BeginKeyChangeResponse);
  // A person's first key needs no authorization; any later one needs a key-change assertion.
  rpc BeginKeyRegistration(BeginKeyRegistrationRequest) returns (BeginKeyRegistrationResponse);
  rpc FinishKeyRegistration(FinishKeyRegistrationRequest) returns (FinishKeyRegistrationResponse);
  rpc RemoveSecurityKey(RemoveSecurityKeyRequest) returns (RemoveSecurityKeyResponse);
  // An admin removes a lost key; the person can then enroll a first key again.
  rpc ResetSecurityKey(ResetSecurityKeyRequest) returns (ResetSecurityKeyResponse);
  // Passing a verification challenge with a security key.
  rpc BeginVerification(BeginVerificationRequest) returns (BeginVerificationResponse);
  rpc FinishVerification(FinishVerificationRequest) returns (FinishVerificationResponse);
}

enum ChallengeStatus {
  CHALLENGE_STATUS_UNSPECIFIED = 0;
  // Waiting for an answer.
  CHALLENGE_STATUS_PENDING = 1;
  // Every kind was passed. The request is allowed on retry until `grant_expires_at`.
  CHALLENGE_STATUS_PASSED = 2;
  // An approver said no. The request is denied until `expires_at`.
  CHALLENGE_STATUS_REJECTED = 3;
  // Not answered in time.
  CHALLENGE_STATUS_EXPIRED = 4;
}

message Challenge {
  // QID: challenge_<uuid>.
  string qid = 1;
  // The decision that opened it (QID: decision_<uuid>).
  string decision_qid = 2;
  awzy.authz.v1.EntityRef subject = 3;
  // Set when a service account acted for a person.
  awzy.authz.v1.EntityRef on_behalf_of = 4;
  string action = 5;
  awzy.authz.v1.EntityRef resource = 6;
  // Every one must be passed.
  repeated awzy.authz.v1.ChallengeKind kinds = 7;
  repeated awzy.authz.v1.ChallengeKind passed = 8;
  ChallengeStatus status = 9;
  // The person it was sent to: the human subject, the person a service account acted for, or a
  // service account's owner. Empty when no one is known, so only an approval can pass it.
  string answerer_id = 10;
  string justification = 11;
  // Who approved or rejected it, and their note.
  // Deprecated: use `decided_by_actor`, which this repeats as text (`Human::alice`).
  string decided_by = 12;
  string decision_note = 13;
  google.protobuf.Timestamp created_at = 14;
  // A pending challenge expires then; a rejected one stops blocking the request then.
  google.protobuf.Timestamp expires_at = 15;
  google.protobuf.Timestamp passed_at = 16;
  // A passed challenge allows the request until then.
  google.protobuf.Timestamp grant_expires_at = 17;
  // Who approved or rejected it (ADR 0060).
  awzy.authz.v1.Actor decided_by_actor = 18;
}

message ResolveRequest {
  // The challenge verdict's decision (QID: decision_<uuid>).
  string decision_qid = 1;
  awzy.authz.v1.EntityRef subject = 2;
  awzy.authz.v1.EntityRef on_behalf_of = 3;
  string action = 4;
  awzy.authz.v1.EntityRef resource = 5;
  // What the verdict requires.
  repeated awzy.authz.v1.ChallengeKind kinds = 6;
  // Who answers it; see Challenge.answerer_id.
  string answerer_id = 7;
  // False only looks up what was passed, and opens nothing.
  bool open = 8;
  // The resource's owner, from its entity, when it has one: told about an approval it's asked
  // for (ADR 0073).
  string resource_owner_id = 9;
}

message ResolveResponse {
  // Required kinds this request has a live grant for.
  repeated awzy.authz.v1.ChallengeKind passed = 1;
  // The pending challenge for the kinds not yet passed, when `open` and some remain.
  string challenge_qid = 2;
  // An approver rejected this request recently: the PDP denies it.
  bool rejected = 3;
}

message GetChallengeRequest {
  string challenge_qid = 1;
}

message GetChallengeResponse {
  Challenge challenge = 1;
}

message ListChallengesRequest {
  // Only challenges sent to this person.
  string answerer_id = 1;
  // Only challenges in this status.
  ChallengeStatus status = 2;
  // Default 50, at most 500.
  int32 limit = 3;
}

message ListChallengesResponse {
  repeated Challenge challenges = 1;
}

message JustifyRequest {
  string challenge_qid = 1;
  // The signed-in person answering.
  // Deprecated: use `answered_by_actor`, which this repeats as text (`Human::alice`).
  string answered_by = 2;
  string justification = 3;
  // Who answered it (ADR 0060).
  awzy.authz.v1.Actor answered_by_actor = 4;
}

message JustifyResponse {
  Challenge challenge = 1;
}

message DecideRequest {
  string challenge_qid = 1;
  // The signed-in person deciding: a Human ID.
  // Deprecated: use `decided_by_actor`, which this repeats as text (`Human::alice`).
  string decided_by = 2;
  bool approve = 3;
  string note = 4;
  // The approver's entities as the caller validated them (the person and their groups from the
  // token), for the PDP's `approve` check. A PDP with awzy-context uses the IdP's instead.
  repeated awzy.authz.v1.Entity approver_entities = 5;
  // Who approved or rejected it (ADR 0060).
  awzy.authz.v1.Actor decided_by_actor = 6;
}

message DecideResponse {
  Challenge challenge = 1;
}

message Containment {
  // QID: containment_<uuid>.
  string qid = 1;
  awzy.authz.v1.EntityRef subject = 2;
  string reason = 3;
  // Deprecated: use `created_by_actor`, which this repeats as text (`Human::alice`).
  string created_by = 4;
  google.protobuf.Timestamp created_at = 5;
  // Unset while active.
  google.protobuf.Timestamp lifted_at = 6;
  // Deprecated: use `lifted_by_actor`, which this repeats as text (`Human::alice`).
  string lifted_by = 7;
  string lift_reason = 8;
  // Who created it (ADR 0060).
  awzy.authz.v1.Actor created_by_actor = 9;
  // Who lifted it (ADR 0060).
  awzy.authz.v1.Actor lifted_by_actor = 10;
  // Recorded but not applied: an automated containment while that scope is in monitor
  // (ADR 0066). Never sent to PDPs; lifting it dismisses it.
  bool monitor = 11;
}

message ContainRequest {
  awzy.authz.v1.EntityRef subject = 1;
  string reason = 2;
  // Deprecated: use `created_by_actor`, which this repeats as text (`Human::alice`).
  string created_by = 3;
  // Who created it (ADR 0060).
  awzy.authz.v1.Actor created_by_actor = 4;
  // Record it without applying it (ADR 0066). An accessor may have one monitored and one
  // enforced containment active at once.
  bool monitor = 5;
}

message ContainResponse {
  Containment containment = 1;
}

message LiftRequest {
  string containment_qid = 1;
  // Deprecated: use `lifted_by_actor`, which this repeats as text (`Human::alice`).
  string lifted_by = 2;
  string reason = 3;
  // Who lifted it (ADR 0060).
  awzy.authz.v1.Actor lifted_by_actor = 4;
}

message LiftResponse {
  Containment containment = 1;
}

message ListContainmentsRequest {
  // Only containments still in force.
  bool active_only = 1;
  // Only this accessor's.
  awzy.authz.v1.EntityRef subject = 2;
  // Default 50, at most 500.
  int32 limit = 3;
  // Monitored containments too, which are otherwise left out (ADR 0066).
  bool include_monitor = 4;
}

message ListContainmentsResponse {
  repeated Containment containments = 1;
}

message WatchContainmentsRequest {}

message WatchContainmentsResponse {
  // Increases with every containment or lift.
  int64 version = 1;
  // True when `active` is the whole list at `version`; false for a heartbeat.
  bool changed = 2;
  repeated Containment active = 3;
}

message SecurityKey {
  // QID: security_key_<uuid>.
  string qid = 1;
  // The person whose key it is, by their Human entity ID (the IdP's user name), not a QID.
  string human_id = 2;
  string name = 3;
  // The key that authorized adding this one; empty for a person's first key.
  string added_with_qid = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_used_at = 6;
  google.protobuf.Timestamp removed_at = 7;
  // Deprecated: use `removed_by_actor`, which this repeats as text (`Human::alice`).
  string removed_by = 8;
  // Who removed it (ADR 0060).
  awzy.authz.v1.Actor removed_by_actor = 9;
}

// A browser's navigator.credentials.get() response.
message Assertion {
  // QID: ceremony_<uuid>, from the Begin call it answers.
  string ceremony_qid = 1;
  bytes credential_id = 2;
  bytes client_data_json = 3;
  bytes authenticator_data = 4;
  bytes signature = 5;
}

message ListSecurityKeysRequest {
  string human_id = 1;
}

message ListSecurityKeysResponse {
  repeated SecurityKey keys = 1;
}

message BeginKeyChangeRequest {
  // The signed-in person.
  string human_id = 1;
}

message BeginKeyChangeResponse {
  // QID: ceremony_<uuid>.
  string ceremony_qid = 1;
  // PublicKeyCredentialRequestOptions as JSON, binary fields base64url.
  string options_json = 2;
}

message BeginKeyRegistrationRequest {
  string human_id = 1;
  // Required once the person has a key: an assertion over a BeginKeyChange ceremony.
  Assertion authorization = 2;
}

message BeginKeyRegistrationResponse {
  string ceremony_qid = 1;
  // PublicKeyCredentialCreationOptions as JSON, binary fields base64url.
  string options_json = 2;
}

message FinishKeyRegistrationRequest {
  string ceremony_qid = 1;
  string human_id = 2;
  // What the person calls the key, e.g. "YubiKey on my keychain".
  string name = 3;
  bytes client_data_json = 4;
  bytes attestation_object = 5;
}

message FinishKeyRegistrationResponse {
  SecurityKey key = 1;
}

message RemoveSecurityKeyRequest {
  // QID: security_key_<uuid>.
  string security_key_qid = 1;
  string human_id = 2;
  // An assertion over a BeginKeyChange ceremony, from any of the person's keys.
  Assertion authorization = 3;
}

message RemoveSecurityKeyResponse {
  SecurityKey key = 1;
}

message ResetSecurityKeyRequest {
  // QID: security_key_<uuid>.
  string security_key_qid = 1;
  // Deprecated: use `removed_by_actor`, which this repeats as text (`Human::alice`).
  string removed_by = 2;
  // The admin removing it (ADR 0060).
  awzy.authz.v1.Actor removed_by_actor = 3;
}

message ResetSecurityKeyResponse {
  SecurityKey key = 1;
}

message BeginVerificationRequest {
  // QID: challenge_<uuid>. Must ask for verification and be sent to human_id.
  string challenge_qid = 1;
  string human_id = 2;
}

message BeginVerificationResponse {
  string ceremony_qid = 1;
  // PublicKeyCredentialRequestOptions as JSON, binary fields base64url.
  string options_json = 2;
}

message FinishVerificationRequest {
  string human_id = 1;
  Assertion assertion = 2;
}

message FinishVerificationResponse {
  Challenge challenge = 1;
}
