# Fuzz targets for awzy-signing (#429), run by cargo-fuzz in CI's fuzz job: `cargo +nightly fuzz
# run <target>` from this folder. Outside the workspace and Bazel: cargo-fuzz builds them itself.
[package]
name = "awzy-signing-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
awzy-signing = { path = ".." }
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }

[workspace]

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false
