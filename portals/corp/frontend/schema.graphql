type Actor {
	"""
	`Human`, `ServiceAccount`, `AwzyService`, `BreakGlassKey`, `AwzyStaff`, or `App`.
	"""
	type: String!
	"""
	A person's IdP ID, a service account ID, an awzy service name, a key fingerprint, a staff user name, or an app's name.
	"""
	id: String!
	"""
	The person it acted for, when it acted for one.
	"""
	onBehalfOf: Actor
	"""
	For people to read: `alice`, or `sales-genie for alice`.
	"""
	label: String!
}

"""
The chart version a release channel names (ADR 0094): every publish moves `FAST`; a
promotion, after a day's soak in fast, moves `STABLE`.
"""
type ChannelVersion {
	channel: ReleaseChannel!
	chartVersion: String!
	"""
	Who moved it: `github-actions` for a publish, the person who asked for a promotion.
	"""
	changedBy: String!
	changedAt: UtcTimestamp!
}

"""
A cloud awzy installs in, and its regions.
"""
type CloudRegions {
	cloud: String!
	regions: [String!]!
}

type DeployedService {
	"""
	e.g. awzy-pdp.
	"""
	name: String!
	version: String
	imageDigest: String
	replicasDesired: Int!
	replicasReady: Int!
	restarts24h: Int
	"""
	The service's own readiness check passes and every desired replica is ready.
	"""
	healthy: Boolean!
}

"""
A feature beyond the base product, which a license may include.
"""
enum Entitlement {
	"""
	Awzy Bot drafting policy in the client portal (ADR 0048).
	"""
	AWZY_BOT
	"""
	awzy-reasoner's investigations with Claude (ADR 0071).
	"""
	INVESTIGATIONS
	"""
	The Google Drive connector (ADR 0069).
	"""
	DRIVE
	"""
	The Jira connector (ADR 0070).
	"""
	JIRA
}

type Install implements Node {
	"""
	Support sessions asked for on this install, newest first (ADR 0095).
	"""
	supportSessions: [SupportSession!]!
	id: ID!
	client: String!
	"""
	e.g. prod or staging.
	"""
	environment: String!
	cloud: String!
	region: String!
	channel: ReleaseChannel!
	pinnedVersion: String
	health: InstallHealth!
	lastSeenAt: UtcTimestamp
	"""
	The Helm chart version the install last reported.
	"""
	chartVersion: String
	"""
	The deployed units inside the install, as last reported.
	"""
	services: [DeployedService!]!
	metrics: InstallMetrics
	"""
	Its heartbeats over `window`, bucketed and oldest first. Buckets with no heartbeat are
	left out, so time the install wasn't reporting shows as a gap.
	"""
	metricHistory(window: MetricWindow!): [MetricSample!]!
	"""
	Chart versions the install has run, newest first: its upgrade history.
	"""
	versionHistory: [VersionSeen!]!
	"""
	The staff member who registered it.
	What the client is licensed for, shared by all its installs; null until staff set it.
	"""
	license: License
	createdBy: Actor!
	createdAt: UtcTimestamp!
	"""
	When it was retired; null while it's active.
	"""
	retiredAt: UtcTimestamp
	"""
	The staff member who retired it.
	"""
	retiredBy: Actor
}

type InstallConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [InstallEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Install!]!
}

"""
An edge in a connection.
"""
type InstallEdge {
	"""
	The item at the end of the edge
	"""
	node: Install!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

enum InstallHealth {
	OK
	"""
	A service isn't ready, or has fewer ready replicas than desired.
	"""
	DEGRADED
	"""
	No heartbeat for 5 minutes.
	"""
	NOT_REPORTING
	NEVER_REPORTED
}

type InstallMetrics {
	decisionsPerSecond: Float
	pdpP99Ms: Float
	"""
	0 to 1.
	"""
	errorRate: Float
	kafkaLag: Int
	"""
	0 to 100.
	"""
	clickhouseDiskUsedPercent: Float
	containmentFeedAgeSeconds: Float
	policySyncAgeSeconds: Float
	principalsSyncAgeSeconds: Float
	connectorSyncAgeSeconds: Float
	"""
	Since the previous heartbeat.
	"""
	gatewayPdpUnreachable: Int
}

type License {
	client: String!
	plan: LicensePlan!
	"""
	How many people it covers.
	"""
	humans: Int!
	"""
	Null when it doesn't end.
	"""
	expiresAt: UtcTimestamp
	"""
	Whether it has ended.
	"""
	expired: Boolean!
	"""
	Features beyond the base product.
	"""
	entitlements: [Entitlement!]!
	updatedBy: Actor!
	updatedAt: UtcTimestamp!
}

enum LicensePlan {
	TRIAL
	STANDARD
	ENTERPRISE
}

"""
One bucket of heartbeats: the worst each figure got in it, and average throughput.
"""
type MetricSample {
	"""
	The bucket's start.
	"""
	at: UtcTimestamp!
	decisionsPerSecond: Float
	pdpP99Ms: Float
	"""
	0 to 1.
	"""
	errorRate: Float
	kafkaLag: Int
	"""
	0 to 100.
	"""
	clickhouseDiskUsedPercent: Float
	"""
	Seconds since the worst PDP's containment feed was heard from (target: 2 s).
	"""
	containmentFeedAgeSeconds: Float
	"""
	Seconds since the worst PDP synced policy (target: a published bundle live within 60 s).
	"""
	policySyncAgeSeconds: Float
	"""
	Seconds since the worst PDP synced principals (target: 60 s).
	"""
	principalsSyncAgeSeconds: Float
	"""
	Seconds since the stalest connector synced.
	"""
	connectorSyncAgeSeconds: Float
	"""
	Tool calls awzy-gateway made without its PDP in the bucket.
	"""
	gatewayPdpUnreachable: Int
	"""
	Some heartbeat in the bucket had a service that wasn't fully ready.
	"""
	degraded: Boolean!
}

"""
How far back the Install page's charts look.
"""
enum MetricWindow {
	"""
	5-minute buckets.
	"""
	DAY
	"""
	30-minute buckets.
	"""
	WEEK
	"""
	2-hour buckets.
	"""
	MONTH
}

type Mutation {
	"""
	Registers an install so its heartbeats are accepted.
	"""
	registerInstall(input: RegisterInstallInput!): RegisterInstallPayload!
	"""
	Moves an install to another channel, or pins it to a chart version. It upgrades or rolls
	back the next time it pulls.
	"""
	setInstallRelease(input: SetInstallReleaseInput!): SetInstallReleasePayload!
	"""
	Retires an install: its reporting and pull tokens stop working at once, it leaves the
	fleet views, and its client and environment can be registered again.
	"""
	retireInstall(input: RetireInstallInput!): RetireInstallPayload!
	"""
	A token for an agent of yours on the corp portal's MCP endpoint (`/mcp`): read-only
	tools, for 30 days, and nothing else here. Shown once.
	"""
	mcpToken: String!
	"""
	Asks an install's admins for a support session. It reaches the install with its next
	heartbeat; they approve or reject it in their client portal.
	"""
	requestSupportSession(input: RequestSupportSessionInput!): SupportSession!
	"""
	Signs the staff member who asked in to an approved session's client portal.
	"""
	signInToSupportSession(supportSessionQid: Qid!): SupportSignIn!
	"""
	Sets a client's license, replacing any it had. Shared by all the client's installs.
	"""
	setLicense(input: SetLicenseInput!): License!
}

interface Node {
	id: ID!
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
}

"""
One of awzy's IDs, `<entity_type>_<uuid>`, e.g. `challenge_0199a8f2-6c1e-7b3a-9d4e-2f8c1a5b7e90`.
Each field and argument takes one entity's; any other is refused.
"""
scalar Qid

type Query {
	"""
	Version of the corp portal API.
	"""
	apiVersion: String!
	"""
	The signed-in staff member.
	"""
	viewer: Staff!
	"""
	Refetches any object by its ID.
	"""
	node(id: ID!): Node
	"""
	The regions an install can be registered in, per cloud; the first of each is the default.
	"""
	cloudRegions: [CloudRegions!]!
	"""
	Every registered install, in registration order.
	"""
	installs(after: String, first: Int): InstallConnection!
	"""
	Chart versions installs report, newest first. Installs that haven't reported a version
	aren't counted.
	"""
	releases: [Release!]!
	"""
	Each channel's chart version, stable first. A channel never moved isn't listed.
	"""
	channels: [ChannelVersion!]!
	"""
	The services an install can report, for filters and empty states.
	"""
	knownServices: [String!]!
	"""
	Every install's support sessions, newest first, up to 200.
	"""
	supportSessions: [SupportSession!]!
}

input RegisterInstallInput {
	"""
	Lowercase slug, e.g. acme.
	"""
	client: String!
	"""
	Lowercase slug, e.g. prod.
	"""
	environment: String!
	"""
	aws, gcp, or azure.
	"""
	cloud: String!
	region: String!
	channel: ReleaseChannel!
	"""
	Required for PINNED, and only then.
	"""
	pinnedVersion: String
}

type RegisterInstallPayload {
	install: Install!
	"""
	The install's reporting token. Shown once: put it in the install's values now.
	"""
	reportingToken: String!
	"""
	Its pull token for the release registry (ADR 0028), shown once like the reporting token.
	Null when this portal doesn't issue pull tokens.
	"""
	pullToken: String
}

type Release {
	version: String!
	installCount: Int!
	installs: [Install!]!
}

enum ReleaseChannel {
	STABLE
	FAST
	PINNED
}

input RequestSupportSessionInput {
	installQid: Qid!
	"""
	Client portal areas, e.g. "decisions".
	"""
	areas: [String!]!
	reason: String!
	durationMinutes: Int!
	"""
	The client portal's URL, e.g. https://portal.example.com.
	"""
	portalUrl: String!
}

input RetireInstallInput {
	installQid: Qid!
}

type RetireInstallPayload {
	install: Install!
}

input SetInstallReleaseInput {
	installQid: Qid!
	channel: ReleaseChannel!
	"""
	Required for PINNED, and only then.
	"""
	pinnedVersion: String
}

type SetInstallReleasePayload {
	install: Install!
}

input SetLicenseInput {
	"""
	The client's slug, as its installs carry it, e.g. acme.
	"""
	client: String!
	plan: LicensePlan!
	"""
	How many people it covers: at least one.
	"""
	humans: Int!
	"""
	When it ends; null for never.
	"""
	expiresAt: UtcTimestamp
	entitlements: [Entitlement!]! = []
}

type Staff {
	username: String!
	name: String!
}

type SupportSession implements Node {
	id: ID!
	status: SupportSessionStatus!
	requestedBy: String!
	areas: [String!]!
	reason: String!
	durationMinutes: Int!
	portalUrl: String!
	requestedAt: UtcTimestamp!
	expiresAt: UtcTimestamp
	"""
	Whether the install has the request yet.
	"""
	delivered: Boolean!
	"""
	The install it's for; None once the install is retired.
	"""
	install: Install
}

enum SupportSessionStatus {
	"""
	Asked for; the install hasn't decided, or hasn't got it yet.
	"""
	REQUESTED
	APPROVED
	REJECTED
	ENDED
	EXPIRED
}

type SupportSignIn {
	"""
	Opens the client portal signed in to the session. Holds the token: don't share it.
	"""
	signInUrl: String!
	expiresAt: UtcTimestamp!
}

scalar UtcTimestamp

type VersionSeen {
	chartVersion: String!
	firstSeenAt: UtcTimestamp!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
}
