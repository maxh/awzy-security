"""
A repair the chart defines.
"""
enum RepairKind {
	"""
	Drops parts ClickHouse detached, empties its own query and metric logs, and applies
	decisions' and events' retention now. Loses none of awzy's data.
	"""
	CLICKHOUSE_DISK_CLEANUP
}

"""
One run of a repair.
"""
type RepairRun {
	"""
	The Job's name, for `kubectl logs job/<name>`.
	"""
	name: String!
	kind: RepairKind!
	status: RepairStatus!
	"""
	Who started it, as the portal knew them.
	"""
	startedBy: String
	startedAt: UtcTimestamp
	finishedAt: UtcTimestamp
}

enum RepairStatus {
	RUNNING
	SUCCEEDED
	FAILED
}

input ResetSecurityKeyInput {
	securityKeyQid: Qid!
}

"""
What awzy-classify decided about a resource (ADR 0047).
"""
type ResourceClassification {
	"""
	None when nothing placed it yet.
	"""
	sensitivity: String
	"""
	label, content, or metadata.
	"""
	by: String
	reason: String!
}

"""
A resource as the PDPs see it.
"""
type ResourceDetail {
	id: String!
	name: String!
	kind: String!
	source: String!
	owner: String
	"""
	The connector's tier.
	"""
	sensitivity: String
	classification: ResourceClassification
	"""
	Who it's shared with, as JSON (the connector's sharing entries). Null when a policy hides
	it (ADR 0103).
	"""
	sharing: JSONString
	labels: [String!]!
	url: String
	"""
	The folders above it, nearest first, by ID.
	"""
	folders: [String!]!
	"""
	Who is assigned to open work that links it or a folder above it.
	"""
	assignees: [String!]!
}

"""
One resource awzy-context knows, as a search finds it.
"""
type ResourceSummary {
	id: String!
	name: String!
	kind: String!
	source: String!
	owner: String
	"""
	The connector's tier; the classifier's may be higher (see `resource`).
	"""
	sensitivity: String
}

"""
What a scope below the install covers (ADR 0109).
"""
enum ScopeKind {
	"""
	One Cedar action, such as `write` or an app's `view_customer`.
	"""
	ACTION
	"""
	One MCP tool behind awzy-gateway, `<server>/<tool>`.
	"""
	TOOL
}

type ScopedEnforcement {
	kind: ScopeKind!
	"""
	The action's name, or the tool's `<server>/<tool>`.
	"""
	name: String!
	setting: EnforcementSetting!
	"""
	Its checks in the last 24 hours.
	"""
	total: Int!
	"""
	Of those in MONITOR, the ones that would have been denied.
	"""
	wouldDeny: Int!
	"""
	Of those in MONITOR, the ones that would have been challenged.
	"""
	wouldChallenge: Int!
}

type SecurityKey implements Node {
	"""
	QID: security_key_<uuid>.
	"""
	id: ID!
	"""
	Whose key it is: the person's `Human` entity ID.
	"""
	humanId: String!
	"""
	What the person called it.
	"""
	name: String!
	"""
	The key that authorized adding this one; null for a person's first key.
	"""
	addedWithQid: Qid
	createdAt: UtcTimestamp
	lastUsedAt: UtcTimestamp
}

type SecurityKeyPayload {
	securityKey: SecurityKey!
}

enum SensitivityTier {
	PUBLIC
	INTERNAL
	CONFIDENTIAL
	CROWN_JEWELS
}

"""
The tier of a server's tools that aren't listed by name.
"""
type ServerTier {
	server: String!
	tier: SensitivityTier!
}

"""
The tier of a server's tools that aren't listed by name.
"""
input ServerTierInput {
	server: String!
	tier: SensitivityTier!
}

"""
An agent, backend service, or scheduled job, with the person accountable for it.
"""
type ServiceAccount {
	"""
	Its ID in policies and tokens.
	"""
	id: String!
	"""
	The accountable person's userName.
	"""
	owner: String!
	ai: Boolean!
	groups: [String!]!
	description: String!
	createdBy: Actor
	createdAt: UtcTimestamp!
	updatedBy: Actor
	updatedAt: UtcTimestamp!
}

