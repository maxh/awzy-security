type Mutation {
	"""
	Validates and saves a draft. Nothing is enforced until it is published.
	"""
	createPolicyDraft(input: CreatePolicyDraftInput!): CreatePolicyDraftPayload!
	"""
	Makes a draft the active bundle. Every PDP picks it up as it's published. A draft that would
	lock the signed-in person out of administering policies isn't published unless they accept
	it.
	"""
	publishPolicyBundle(input: PublishPolicyBundleInput!): PublishPolicyBundlePayload!
	"""
	Switches a scope between MONITOR and ENFORCE. Every PDP picks up the install's as it's made;
	awzy-reasoner reads automated containments' on its next run. Policy can ask for a security
	key first, as the base policies do (`switch_enforcement`): then nothing is switched, and the
	payload names the challenge to pass before switching again.
	"""
	setEnforcementMode(input: SetEnforcementModeInput!): SetEnforcementModePayload!
	"""
	Gives an action or a tool a mode of its own (ADR 0109), so, for example, agents' writes
	are enforced while their reads stay in MONITOR. Policy can ask for a security key first, as
	for the install's (`switch_enforcement`).
	"""
	setScopedEnforcementMode(input: SetScopedEnforcementModeInput!): SetEnforcementModePayload!
	"""
	Replaces the outage fallback setting. Like switching enforcement, policy can ask for a
	security key first: then nothing changes, and the payload names the challenge to pass.
	"""
	setOutageFallback(input: SetOutageFallbackInput!): SetOutageFallbackPayload!
	"""
	Approves or rejects a support session. Approving lets an awzy staff member view the areas
	approved, read-only, until it expires; like switching enforcement, policy can ask for a
	security key first.
	"""
	decideSupportSession(input: DecideSupportSessionInput!): DecideSupportSessionPayload!
	"""
	Ends an approved support session now. The staff member's next request is refused.
	"""
	endSupportSession(supportSessionQid: Qid!): SupportSession!
	"""
	Registers a service account, or changes one. Until it's registered, the PDP denies it.
	"""
	registerServiceAccount(input: RegisterServiceAccountInput!): RegisterServiceAccountPayload!
	"""
	Removes a service account. From then on the PDP denies it.
	"""
	removeServiceAccount(input: RemoveServiceAccountInput!): RemoveServiceAccountPayload!
	"""
	Trusts an app to sign tokens for its own agents, or changes how. Enforcement points accept
	its tokens within seconds.
	"""
	registerTokenIssuer(input: RegisterTokenIssuerInput!): RegisterTokenIssuerPayload!
	"""
	Stops trusting an app's tokens. Its agents stay registered until they're removed.
	"""
	removeTokenIssuer(input: RemoveTokenIssuerInput!): RemoveTokenIssuerPayload!
	"""
	One turn of a conversation with Awzy Bot.
	"""
	askAwzyBot(input: AskAwzyBotInput!): AskAwzyBotPayload!
	"""
	Answers a justification challenge sent to the signed-in person.
	"""
	justifyChallenge(input: JustifyChallengeInput!): ChallengePayload!
	"""
	Approves or rejects someone else's request. awzy-challenge checks with the PDP that the
	signed-in person, or a service account such as an overseer agent (ADR 0065), may approve the
	resource.
	"""
	decideChallenge(input: DecideChallengeInput!): ChallengePayload!
	"""
	Revokes a principal's access until it's lifted. Every PDP applies it within seconds.
	"""
	containPrincipal(input: ContainPrincipalInput!): ContainmentPayload!
	liftContainment(input: LiftContainmentInput!): ContainmentPayload!
	"""
	For someone who already has a key: a ceremony whose assertion authorizes adding or
	removing one.
	"""
	beginSecurityKeyChange: WebAuthnCeremony!
	"""
	A registration ceremony. Your first key needs nothing else; a later one needs
	`authorization` from a key you have.
	"""
	beginSecurityKeyRegistration(input: BeginSecurityKeyRegistrationInput!): WebAuthnCeremony!
	finishSecurityKeyRegistration(input: FinishSecurityKeyRegistrationInput!): SecurityKeyPayload!
	removeSecurityKey(input: RemoveSecurityKeyInput!): SecurityKeyPayload!
	"""
	Removes someone's lost key, so they can enroll a first key again. For those who
	administer challenges.
	"""
	resetSecurityKey(input: ResetSecurityKeyInput!): SecurityKeyPayload!
	"""
	An assertion ceremony for a verification challenge sent to you.
	"""
	beginChallengeVerification(input: BeginChallengeVerificationInput!): WebAuthnCeremony!
	"""
	Passes the verification with your key's assertion.
	"""
	finishChallengeVerification(input: FinishChallengeVerificationInput!): ChallengePayload!
	"""
	Closes an investigation once a person has reviewed it. It stays, with who closed it and why.
	"""
	closeInvestigation(input: CloseInvestigationInput!): CloseInvestigationPayload!
	"""
	Starts a repair, unless one of its kind is running. For those who may administer the
	enforcement area.
	"""
	startRepair(kind: RepairKind!): RepairRun!
	"""
	Configures a connector, and sets its credential if one is given. awzy-connectors picks the
	change up within a minute or so. For those who may administer the enforcement area; policy
	can ask for a security key first, as the base policies do: then nothing is saved, and the
	payload names the challenge to pass before saving again.
	"""
	configureConnector(input: ConfigureConnectorInput!): ConfigureConnectorPayload!
}

