type Actor {
	"""
	`Human`, `ServiceAccount`, `AwzyService`, `BreakGlassKey`, or `AwzyStaff`.
	"""
	type: String!
	"""
	A person's IdP ID, a service account ID, an awzy service name, a key fingerprint, or a staff user name.
	"""
	id: String!
	"""
	The person it acted for, when it acted for one.
	"""
	onBehalfOf: Actor
	"""
	For people to read: `alice`, or `sales-genie for alice`.
	"""
	label: String!
}

input AskAwzyBotInput {
	"""
	What the person asks.
	"""
	message: String!
	"""
	The conversation so far, exactly as the last answer returned it. Omit to start over.
	"""
	transcript: String
}

type AskAwzyBotPayload {
	"""
	Awzy Bot's answer, in Markdown.
	"""
	reply: String!
	"""
	The whole conversation, for the next turn. Opaque: send it back unchanged.
	"""
	transcript: String!
	"""
	Policy drafts Awzy Bot saved this turn.
	"""
	drafts: [PolicyBundle!]!
	"""
	The tools it used this turn, in order.
	"""
	toolsUsed: [String!]!
	"""
	The model declined to answer.
	"""
	refused: Boolean!
}

"""
A `navigator.credentials.get()` response.
"""
input AssertionInput {
	ceremonyQid: ID!
	"""
	`rawId`, base64url.
	"""
	credentialId: String!
	"""
	`response.clientDataJSON`, base64url.
	"""
	clientDataJson: String!
	"""
	`response.authenticatorData`, base64url.
	"""
	authenticatorData: String!
	"""
	`response.signature`, base64url.
	"""
	signature: String!
}

input BeginChallengeVerificationInput {
	challengeQid: ID!
}

input BeginSecurityKeyRegistrationInput {
	"""
	Required once you have a key: an assertion over a `beginSecurityKeyChange` ceremony.
	"""
	authorization: AssertionInput
}

type Challenge implements Node {
	"""
	QID: challenge_<uuid>.
	"""
	id: ID!
	"""
	The decision that opened it.
	"""
	decisionQid: String!
	subject: EntityRef
	"""
	Set when a service account acted for a person.
	"""
	onBehalfOf: EntityRef
	action: String!
	resource: EntityRef
	"""
	Every one must be passed.
	"""
	kinds: [ChallengeKind!]!
	passed: [ChallengeKind!]!
	status: ChallengeStatus!
	"""
	The person it was sent to. Null when no one is known, so only an approval can pass it.
	"""
	answererId: String
	justification: String
	"""
	Who approved or rejected it.
	"""
	decidedBy: Actor
	decisionNote: String
	createdAt: UtcTimestamp
	"""
	A pending challenge expires then; a rejection stops blocking the request then.
	"""
	expiresAt: UtcTimestamp
	passedAt: UtcTimestamp
	"""
	A passed challenge allows the request until then.
	"""
	grantExpiresAt: UtcTimestamp
}

enum ChallengeKind {
	"""
	The person says why they need the access.
	"""
	JUSTIFICATION
	"""
	A security key (WebAuthn). Not available yet.
	"""
	VERIFICATION
	"""
	Someone else approves.
	"""
	APPROVAL
	"""
	A biometric check through an external provider. Not available yet.
	"""
	BIOMETRIC
}

type ChallengePayload {
	challenge: Challenge!
}

enum ChallengeStatus {
	"""
	Waiting for an answer.
	"""
	PENDING
	"""
	Every kind passed: the request is allowed on retry until `grantExpiresAt`.
	"""
	PASSED
	"""
	An approver said no: the request is denied until `expiresAt`.
	"""
	REJECTED
	"""
	Not answered in time.
	"""
	EXPIRED
}

"""
One piece of evidence the finding relied on.
"""
type CitedEvidence {
	"""
	The evidence's ID: a decision or challenge QID, an event's ID, or a resource ID.
	"""
	evidenceId: String!
	"""
	What the model said it shows.
	"""
	why: String!
}

"""
Live updates: the Challenges page's challenges and containments.
"""
type ClientPortalSubscription {
	"""
	Challenges as they're opened or change: the signed-in person's own, or every one for those
	who administer challenges.
	"""
	challengeUpdated: Challenge!
	"""
	Every active containment, whenever one is added or lifted. For those who administer
	challenges.
	"""
	containmentsChanged: [Containment!]!
}

input CloseInvestigationInput {
	investigationQid: ID!
	"""
	What the review found.
	"""
	reason: String!
}

type CloseInvestigationPayload {
	investigation: Investigation!
}

input ContainPrincipalInput {
	subject: EntityRefInput!
	reason: String!
}

type Containment {
	"""
	QID: containment_<uuid>.
	"""
	id: ID!
	subject: EntityRef
	reason: String!
	createdBy: Actor
	createdAt: UtcTimestamp
	"""
	Null while it's in force.
	"""
	liftedAt: UtcTimestamp
	liftedBy: Actor
	liftReason: String
	"""
	Recorded but not applied: awzy-reasoner would have contained this principal, and automated
	containments are in monitor (ADR 0066). Lifting it dismisses it.
	"""
	monitor: Boolean!
}

type ContainmentPayload {
	containment: Containment!
}

input CreatePolicyDraftInput {
	schema: String!
	policies: String!
}

type CreatePolicyDraftPayload {
	"""
	The new draft, unless validation failed.
	"""
	bundle: PolicyBundle
	"""
	Why the bundle was rejected: Cedar parse or schema validation errors.
	"""
	validationError: String
}

input DecideChallengeInput {
	challengeQid: ID!
	approve: Boolean!
	note: String
}

type Decision implements Node {
	"""
	QID: decision_<uuid>, the ID the PDP returned to the enforcement point.
	"""
	id: ID!
	at: UtcTimestamp!
	subject: EntityRef!
	"""
	Set when a service account acted for a person: that person and their own check.
	"""
	onBehalfOf: OnBehalfOf
	"""
	Whether a person was there to answer a challenge.
	"""
	humanPresent: Boolean!
	action: String!
	resource: EntityRef!
	"""
	What policy decided. For a delegated request, the stricter of the subject's and the
	person's checks. In MONITOR mode it was not applied: a DENY is a "would deny".
	"""
	verdict: Verdict!
	mode: EnforcementMode!
	"""
	When the verdict is CHALLENGE: every challenge kind required.
	"""
	challenges: [String!]!
	"""
	IDs of the policies that determined the subject's own check.
	"""
	policies: [String!]!
	"""
	The policy bundle version in force; 0 means the built-in defaults.
	"""
	policyVersion: Int!
	"""
	The request context, as JSON text.
	"""
	context: String!
	"""
	Explain the subject's check: the source of each determining policy, from the bundle the
	decision was made under.
	"""
	determiningPolicies: [PolicySource!]!
}

type DecisionConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [DecisionEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Decision!]!
}

"""
An edge in a connection.
"""
type DecisionEdge {
	"""
	The item at the end of the edge
	"""
	node: Decision!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

input DecisionFilter {
	subjectId: String
	resourceId: String
	verdict: Verdict
	mode: EnforcementMode
	"""
	Defaults to 24 hours ago; at most 30 days ago.
	"""
	since: UtcTimestamp
}

type DirectoryGroup {
	"""
	The group's ID in policies, e.g. Group::"security".
	"""
	name: String!
	"""
	Humans directly in it.
	"""
	humans: Int!
	"""
	Groups nested in it.
	"""
	groups: Int!
	"""
	Groups it is nested in.
	"""
	parents: [String!]!
	updatedAt: UtcTimestamp!
}

type DirectorySummary {
	humans: Int!
	activeHumans: Int!
	groups: Int!
	serviceAccounts: Int!
	"""
	When the IdP last changed a person or group.
	"""
	lastProvisionedAt: UtcTimestamp
}

enum EnforcementMode {
	"""
	Decisions are recorded but not applied: enforcement points allow.
	"""
	MONITOR
	"""
	Enforcement points apply the verdict.
	"""
	ENFORCE
}

"""
What a mode applies to.
"""
enum EnforcementScope {
	"""
	The install's verdicts: whether enforcement points apply them.
	"""
	INSTALL
	"""
	awzy-reasoner's automated containments: whether they're applied or only recorded.
	"""
	AUTOMATED_CONTAINMENTS
}

type EnforcementSetting {
	mode: EnforcementMode!
	"""
	Null when the scope has never been switched (every scope starts in MONITOR).
	"""
	changedBy: Actor
	changedAt: UtcTimestamp
}

"""
What enforcing would have changed, over a window of logged decisions.
"""
type EnforcementSummary {
	since: UtcTimestamp!
	total: Int!
	"""
	Decisions made in MONITOR mode.
	"""
	monitored: Int!
	"""
	MONITOR-mode decisions that would have been denied.
	"""
	wouldDeny: Int!
	"""
	MONITOR-mode decisions that would have been challenged.
	"""
	wouldChallenge: Int!
	enforcedDeny: Int!
	enforcedChallenge: Int!
}

type EntityRef {
	type: String!
	id: String!
}

input EntityRefInput {
	"""
	`Human` or `ServiceAccount`.
	"""
	type: String!
	id: String!
}

input FinishChallengeVerificationInput {
	assertion: AssertionInput!
}

input FinishSecurityKeyRegistrationInput {
	ceremonyQid: ID!
	"""
	What to call the key, e.g. "YubiKey on my keychain".
	"""
	name: String!
	"""
	`response.clientDataJSON`, base64url.
	"""
	clientDataJson: String!
	"""
	`response.attestationObject`, base64url.
	"""
	attestationObject: String!
}

"""
A person, as the IdP provisioned them: a `Human` in policies.
"""
type Human {
	"""
	Their ID in policies and tokens.
	"""
	userName: String!
	displayName: String
	"""
	False once deprovisioned: denied everything.
	"""
	active: Boolean!
	"""
	Groups they're directly in.
	"""
	groups: [String!]!
	updatedAt: UtcTimestamp!
}

type Investigation {
	"""
	QID: investigation_<uuid>.
	"""
	id: ID!
	"""
	The person or service account it's about.
	"""
	subject: EntityRef!
	"""
	Why the reasoner opened it.
	"""
	trigger: String!
	"""
	The deterministic risk score when it ran: the floor for its risk.
	"""
	floor: Int!
	status: InvestigationStatus!
	verdict: InvestigationVerdict!
	risk: Int!
	summary: String!
	evidence: [CitedEvidence!]!
	containment: InvestigationContainment!
	"""
	What awzy's checks changed in the model's finding.
	"""
	notes: [String!]!
	model: String!
	inputTokens: Int!
	outputTokens: Int!
	startedAt: UtcTimestamp!
	finishedAt: UtcTimestamp!
	closedBy: Actor
	closedAt: UtcTimestamp
	closeReason: String
}

enum InvestigationContainment {
	"""
	None was recommended, or awzy's checks dropped it.
	"""
	NONE
	"""
	For a person to decide: the principal is privileged.
	"""
	PROPOSE
	"""
	Sent to automated containments, which apply it only when enforcing.
	"""
	RECOMMEND
}

enum InvestigationStatus {
	"""
	A person has to decide: a proposed containment, or benign about someone the scores flag.
	"""
	NEEDS_REVIEW
	"""
	Nothing for a person to do.
	"""
	DONE
	"""
	A person reviewed and closed it.
	"""
	CLOSED
}

enum InvestigationVerdict {
	MALICIOUS
	SUSPICIOUS
	BENIGN
	INCONCLUSIVE
}

input JustifyChallengeInput {
	challengeQid: ID!
	"""
	Why the access is needed: at least 20 characters.
	"""
	justification: String!
}

input LiftContainmentInput {
	containmentQid: ID!
	reason: String!
}

type Mutation {
	"""
	Validates and saves a draft. Nothing is enforced until it is published.
	"""
	createPolicyDraft(input: CreatePolicyDraftInput!): CreatePolicyDraftPayload!
	"""
	Makes a draft the active bundle. PDPs pick it up within about 10 seconds.
	"""
	publishPolicyBundle(input: PublishPolicyBundleInput!): PublishPolicyBundlePayload!
	"""
	Switches a scope between MONITOR and ENFORCE. PDPs pick up the install's within about 10
	seconds; awzy-reasoner reads automated containments' on its next run.
	TODO: require a security-key challenge for the switch to ENFORCE (awzy-challenge).
	"""
	setEnforcementMode(input: SetEnforcementModeInput!): SetEnforcementModePayload!
	"""
	Registers a service account, or changes one. Until it's registered, the PDP denies it.
	"""
	registerServiceAccount(input: RegisterServiceAccountInput!): RegisterServiceAccountPayload!
	"""
	Removes a service account. From then on the PDP denies it.
	"""
	removeServiceAccount(input: RemoveServiceAccountInput!): RemoveServiceAccountPayload!
	"""
	One turn of a conversation with Awzy Bot.
	"""
	askAwzyBot(input: AskAwzyBotInput!): AskAwzyBotPayload!
	"""
	Answers a justification challenge sent to the signed-in person.
	"""
	justifyChallenge(input: JustifyChallengeInput!): ChallengePayload!
	"""
	Approves or rejects someone else's request. awzy-challenge checks with the PDP that the
	signed-in person, or a service account such as an overseer agent (ADR 0065), may approve the
	resource.
	"""
	decideChallenge(input: DecideChallengeInput!): ChallengePayload!
	"""
	Revokes a principal's access until it's lifted. Every PDP applies it within seconds.
	"""
	containPrincipal(input: ContainPrincipalInput!): ContainmentPayload!
	liftContainment(input: LiftContainmentInput!): ContainmentPayload!
	"""
	For someone who already has a key: a ceremony whose assertion authorizes adding or
	removing one.
	"""
	beginSecurityKeyChange: WebAuthnCeremony!
	"""
	A registration ceremony. Your first key needs nothing else; a later one needs
	`authorization` from a key you have.
	"""
	beginSecurityKeyRegistration(input: BeginSecurityKeyRegistrationInput!): WebAuthnCeremony!
	finishSecurityKeyRegistration(input: FinishSecurityKeyRegistrationInput!): SecurityKeyPayload!
	removeSecurityKey(input: RemoveSecurityKeyInput!): SecurityKeyPayload!
	"""
	Removes someone's lost key, so they can enroll a first key again. For those who
	administer challenges.
	"""
	resetSecurityKey(input: ResetSecurityKeyInput!): SecurityKeyPayload!
	"""
	An assertion ceremony for a verification challenge sent to you.
	"""
	beginChallengeVerification(input: BeginChallengeVerificationInput!): WebAuthnCeremony!
	"""
	Passes the verification with your key's assertion.
	"""
	finishChallengeVerification(input: FinishChallengeVerificationInput!): ChallengePayload!
	"""
	Closes an investigation once a person has reviewed it. It stays, with who closed it and why.
	"""
	closeInvestigation(input: CloseInvestigationInput!): CloseInvestigationPayload!
}

interface Node {
	id: ID!
}

type OnBehalfOf {
	human: EntityRef!
	verdict: Verdict!
	policies: [String!]!
	determiningPolicies: [PolicySource!]!
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
}

type PolicyBundle implements Node {
	"""
	QID: policy_bundle_<uuid>.
	"""
	id: ID!
	"""
	Increases with every bundle; decisions record the version they were made under.
	"""
	version: Int!
	status: PolicyBundleStatus!
	"""
	Cedar schema.
	"""
	schema: String!
	"""
	Cedar policies.
	"""
	policies: String!
	createdBy: Actor
	createdAt: UtcTimestamp
	publishedBy: Actor
	publishedAt: UtcTimestamp
}

enum PolicyBundleStatus {
	DRAFT
	ACTIVE
	SUPERSEDED
}

type PolicyDryRun {
	days: Int!
	"""
	The active bundle's version the draft was compared with; 0 for the built-in defaults.
	"""
	comparedWithVersion: Int!
	"""
	Decisions in the window, all of them.
	"""
	decisions: Int!
	"""
	Distinct requests among them.
	"""
	distinctRequests: Int!
	"""
	Distinct requests replayed: the most frequent, up to the limit.
	"""
	replayedRequests: Int!
	"""
	Fewer were replayed than there were.
	"""
	truncated: Boolean!
	"""
	Decisions whose verdict the draft leaves as it is.
	"""
	unchangedDecisions: Int!
	"""
	Changes of verdict, most decisions first.
	"""
	changes: [PolicyDryRunChange!]!
	"""
	Requests that couldn't be replayed, and why the first one couldn't.
	"""
	skippedRequests: Int!
	skippedReason: String
}

type PolicyDryRunChange {
	"""
	The verdict under the active bundle: allow, deny, or challenge (with its kinds).
	"""
	from: String!
	"""
	The verdict under the draft.
	"""
	to: String!
	"""
	Decisions in the window that would have come out differently.
	"""
	decisions: Int!
	"""
	Distinct requests among them.
	"""
	requests: Int!
	"""
	The most frequent ones.
	"""
	examples: [PolicyDryRunExample!]!
}

type PolicyDryRunExample {
	subjectType: String!
	subjectId: String!
	"""
	The person a service account acted for, if any.
	"""
	onBehalfOfId: String
	action: String!
	resourceId: String!
	"""
	How many times this exact request was decided in the window.
	"""
	decisions: Int!
	"""
	One of those decisions, `decision_<uuid>`.
	"""
	sampleDecisionQid: String!
	"""
	The policies that decided it under the active bundle, and under the draft.
	"""
	policiesBefore: [String!]!
	policiesAfter: [String!]!
}

type PolicySource {
	"""
	The policy's @id annotation, or Cedar's generated ID.
	"""
	id: String!
	source: String!
}

enum PortalAction {
	"""
	Read an area.
	"""
	VIEW
	"""
	Change what an area controls: publish policy, switch enforcement.
	"""
	ADMINISTER
}

enum PortalArea {
	DECISIONS
	POLICIES
	ENFORCEMENT
	"""
	People and groups from the IdP, and service accounts.
	"""
	DIRECTORY
	"""
	`view`: answer your own challenges. `administer`: every challenge, and containments.
	"""
	CHALLENGES
	"""
	`view`: awzy-reasoner's investigations (ADR 0071). `administer`: close them.
	"""
	INVESTIGATIONS
}

input PublishPolicyBundleInput {
	"""
	A draft bundle's QID.
	"""
	policyBundleQid: ID!
}

type PublishPolicyBundlePayload {
	bundle: PolicyBundle!
}

type Query {
	"""
	Version of the client portal API.
	"""
	apiVersion: String!
	"""
	Who is signed in.
	"""
	viewer: ViewerInfo!
	"""
	Whether the viewer may do `action` in `area`, so the portal can hide what they can't use.
	"""
	viewerCan(action: PortalAction!, area: PortalArea!): Boolean!
	"""
	Refetches any object by its ID.
	"""
	node(id: ID!): Node
	"""
	The bundle the PDPs enforce, if one has been published.
	"""
	activePolicyBundle: PolicyBundle
	"""
	Newest first.
	"""
	policyBundles(first: Int! = 50): [PolicyBundle!]!
	"""
	Decisions newest first. Cursors are opaque.
	"""
	decisions(after: String, first: Int, filter: DecisionFilter): DecisionConnection!
	"""
	A scope's enforcement mode: the install's by default.
	"""
	enforcement(scope: EnforcementScope! = INSTALL): EnforcementSetting!
	"""
	Every switch of a scope's mode, newest first.
	"""
	enforcementHistory(scope: EnforcementScope! = INSTALL, first: Int! = 20): [EnforcementSetting!]!
	"""
	Would-deny and would-challenge counts since `since` (default 24 hours, at most 30 days).
	"""
	enforcementSummary(since: UtcTimestamp): EnforcementSummary!
	directorySummary: DirectorySummary!
	"""
	Humans by userName; `search` matches userName or display name.
	"""
	humans(search: String, first: Int! = 200): [Human!]!
	groups: [DirectoryGroup!]!
	serviceAccounts: [ServiceAccount!]!
	"""
	What a draft bundle would change (ADR 0049): recent requests replayed under the active
	bundle and the draft, with today's people and resources, and the verdicts compared.
	`days` defaults to 7, at most 30.
	"""
	policyDryRun(draftQid: ID!, days: Int): PolicyDryRun!
	"""
	Whether this install has Awzy Bot set up (ADR 0048).
	"""
	awzyBotEnabled: Boolean!
	"""
	Challenges sent to the signed-in person, newest first.
	"""
	myChallenges(status: ChallengeStatus, first: Int): [Challenge!]!
	"""
	Every challenge, newest first. For those who administer challenges.
	"""
	challenges(status: ChallengeStatus, first: Int): [Challenge!]!
	"""
	Containments, newest first. For those who administer challenges.
	"""
	containments(activeOnly: Boolean! = true, first: Int): [Containment!]!
	"""
	The signed-in person's security keys.
	"""
	mySecurityKeys: [SecurityKey!]!
	"""
	Someone's security keys, to reset a lost one. For those who administer challenges.
	"""
	securityKeys(humanId: String!): [SecurityKey!]!
	"""
	Investigations, newest first, optionally only those with one status.
	"""
	investigations(status: InvestigationStatus, first: Int! = 50): [Investigation!]!
	"""
	One investigation by its QID.
	"""
	investigation(id: ID!): Investigation
}

