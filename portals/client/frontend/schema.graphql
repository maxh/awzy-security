type PolicyDryRun {
	days: Int!
	"""
	The active bundle's version the draft was compared with; 0 for the built-in defaults.
	"""
	comparedWithVersion: Int!
	"""
	Decisions in the window, all of them.
	"""
	decisions: Int!
	"""
	Distinct requests among them.
	"""
	distinctRequests: Int!
	"""
	Distinct requests replayed: the most frequent, up to the limit.
	"""
	replayedRequests: Int!
	"""
	Fewer were replayed than there were.
	"""
	truncated: Boolean!
	"""
	Decisions whose verdict the draft leaves as it is.
	"""
	unchangedDecisions: Int!
	"""
	Changes of verdict, most decisions first.
	"""
	changes: [PolicyDryRunChange!]!
	"""
	Requests that couldn't be replayed, and why the first one couldn't.
	"""
	skippedRequests: Int!
	skippedReason: String
	"""
	Query plans in the window (ADR 0113). A plan decides no one resource, so a dry run
	doesn't replay them; it says how many there were.
	"""
	plansNotReplayed: Int!
}

type PolicyDryRunChange {
	"""
	The verdict under the active bundle: allow, deny, or challenge (with its kinds).
	"""
	from: String!
	"""
	The verdict under the draft.
	"""
	to: String!
	"""
	Decisions in the window that would have come out differently.
	"""
	decisions: Int!
	"""
	Distinct requests among them.
	"""
	requests: Int!
	"""
	The most frequent ones.
	"""
	examples: [PolicyDryRunExample!]!
}

type PolicyDryRunExample {
	principalType: String!
	principalId: String!
	"""
	The person a service account acted for, if any.
	"""
	onBehalfOfId: String
	action: String!
	resourceId: String!
	"""
	How many times this exact request was decided in the window.
	"""
	decisions: Int!
	"""
	One of those decisions, `decision_<uuid>`.
	Null if the sample's ID in ClickHouse isn't a UUID.
	"""
	sampleDecisionQid: Qid
	"""
	The policies that decided it under the active bundle, and under the draft.
	"""
	policiesBefore: [String!]!
	policiesAfter: [String!]!
}

type PolicySource {
	"""
	The policy's @id annotation, or Cedar's generated ID.
	"""
	id: String!
	source: String!
}

enum PortalAction {
	"""
	Read an area.
	"""
	VIEW
	"""
	Change what an area controls: publish policy, switch enforcement.
	"""
	ADMINISTER
}

enum PortalArea {
	DECISIONS
	POLICIES
	ENFORCEMENT
	"""
	People and groups from the IdP, and service accounts.
	"""
	DIRECTORY
	"""
	`view`: answer your own challenges. `administer`: every challenge, and containments.
	"""
	CHALLENGES
	"""
	`view`: awzy-reasoner's investigations (ADR 0071). `administer`: close them.
	"""
	INVESTIGATIONS
}

"""
A person or service account as the PDPs see it.
"""
type PrincipalDetail {
	"""
	Whether awzy knows it at all: provisioned by the IdP, or a registered service account.
	"""
	known: Boolean!
	"""
	Its Cedar attributes, as JSON: `active`, a service account's `owner` and `ai`. Null when a
	policy hides them (ADR 0103).
	"""
	attributes: JSONObject
	"""
	Every group above it, nested groups included.
	"""
	groups: [String!]!
	"""
	awzy-reasoner's risk score, 0 to 100, when it has one and no policy hides it (ADR 0103).
	"""
	riskScore: Int
}

enum PrincipalType {
	HUMAN
	SERVICE_ACCOUNT
}

input PublishPolicyBundleInput {
	"""
	A draft bundle's QID.
	"""
	policyBundleQid: Qid!
	"""
	Publish even though the draft would stop the signed-in person administering policies.
	"""
	acceptLockout: Boolean! = false
}

type PublishPolicyBundlePayload {
	"""
	The bundle, now active. Null when publishing waits for `acceptLockout`.
	"""
	bundle: PolicyBundle
	"""
	Set, and nothing published, when the draft would deny the signed-in person `administer` on
	the policies area: they couldn't fix it from the portal afterwards, only by break-glass.
	"""
	wouldLockYouOut: String
}

"""
One of awzy's IDs, `<entity_type>_<uuid>`, e.g. `challenge_0199a8f2-6c1e-7b3a-9d4e-2f8c1a5b7e90`.
Each field and argument takes one entity's; any other is refused.
"""
scalar Qid

type Query {
	"""
	Version of the client portal API.
	"""
	apiVersion: String!
	"""
	Who is signed in.
	"""
	viewer: ViewerInfo!
	"""
	Whether the viewer may do `action` in `area`, so the portal can hide what they can't use.
	"""
	viewerCan(action: PortalAction!, area: PortalArea!): Boolean!
	"""
	The areas the viewer may view, so the portal shows only the pages they can open. Asks the
	PDP about each area at once.
	"""
	viewerAreas: [PortalArea!]!
	"""
	Refetches any object by its ID.
	"""
	node(id: ID!): Node
	"""
	The bundle the PDPs enforce, if one has been published.
	"""
	activePolicyBundle: PolicyBundle
	"""
	Newest first.
	"""
	policyBundles(first: Int! = 50): [PolicyBundle!]!
	"""
	Decisions newest first. Cursors are opaque.
	"""
	decisions(after: String, first: Int, filter: DecisionFilter): DecisionConnection!
	"""
	A scope's enforcement mode: the install's by default.
	"""
	enforcement(scope: EnforcementScope! = INSTALL): EnforcementSetting!
	"""
	Every switch of a scope's mode, newest first.
	"""
	enforcementHistory(scope: EnforcementScope! = INSTALL, first: Int! = 20): [EnforcementSetting!]!
	"""
	Actions and tools with a mode of their own (ADR 0109), which a check takes over the
	install's: its tool's first, then its action's.
	"""
	enforcementScopes: [ScopedEnforcement!]!
	"""
	Would-deny and would-challenge counts since `since` (default 24 hours, at most 30 days).
	"""
	enforcementSummary(since: UtcTimestamp): EnforcementSummary!
	directorySummary: DirectorySummary!
	"""
	Humans by userName; `search` matches userName or display name.
	"""
	humans(search: String, first: Int! = 200): [Human!]!
	groups: [DirectoryGroup!]!
	serviceAccounts: [ServiceAccount!]!
	"""
	Apps trusted to sign tokens for their own agents, besides the IdP.
	"""
	tokenIssuers: [TokenIssuer!]!
	"""
	What a draft bundle would change (ADR 0049): recent requests replayed under the active
	bundle and the draft, with today's people and resources, and the verdicts compared.
	`days` defaults to 7, at most 30.
	"""
	policyDryRun(draftQid: Qid!, days: Int): PolicyDryRun!
	"""
	Whether this install has Awzy Bot set up (ADR 0048).
	"""
	awzyBotEnabled: Boolean!
	"""
	Challenges sent to the signed-in person, newest first.
	"""
	myChallenges(status: ChallengeStatus, first: Int): [Challenge!]!
	"""
	Requests waiting for an approval the signed-in principal may give, newest first: a
	resource's owner, say, or an overseer agent policy names.
	"""
	challengesToApprove(first: Int): [Challenge!]!
	"""
	Every challenge, newest first. For those who administer challenges.
	"""
	challenges(status: ChallengeStatus, first: Int): [Challenge!]!
	"""
	How awzy-reasoner's containments held up on review over the last `days` (default 30): for
	the Enforcement page, beside automated containments' mode. Counts the 500 most recent.
	Null when awzy-challenge can't say, so the page still loads.
	"""
	containmentReview(days: Int! = 30): ContainmentReview
	"""
	Containments, newest first. For those who administer challenges.
	"""
	containments(activeOnly: Boolean! = true, first: Int): [Containment!]!
	"""
	The signed-in person's security keys.
	"""
	mySecurityKeys: [SecurityKey!]!
	"""
	Someone's security keys, to reset a lost one. For those who administer challenges.
	"""
	securityKeys(humanId: String!): [SecurityKey!]!
	"""
	Investigations, newest first, optionally only those with one status.
	"""
	investigations(status: InvestigationStatus, first: Int! = 50): [Investigation!]!
	"""
	Whether each of awzy's services the portal uses is ready, and the release it runs. For
	those who may view the enforcement area.
	"""
	installStatus: [ComponentStatus!]!
	"""
	What this install sends awzy, and the last heartbeat it sent. For those who may view the
	enforcement area.
	"""
	heartbeatExport: HeartbeatExport!
	"""
	The configured connectors and how their syncing is going. For those who may view the
	enforcement area.
	"""
	connectors: [Connector!]!
	"""
	The connectors configured in the portal. For those who may view the enforcement area.
	"""
	connectorConfigs: [ConnectorConfig!]!
	"""
	Whether this install can keep connector credentials (its cloud's secrets manager is set
	up), so the portal can say why it can't.
	"""
	connectorCredentialsSupported: Boolean!
	"""
	What awzy-gateway does while the PDP is unreachable: each tool's tier, and which tiers
	fail open.
	"""
	outageFallback: OutageFallback!
	"""
	Support sessions awzy staff asked for, newest first. For those who may view enforcement.
	"""
	supportSessions: [SupportSession!]!
	"""
	Null unless the viewer is awzy staff in a support session.
	"""
	viewerSupport: ViewerSupport
	"""
	A person or service account as the PDPs see it: attributes, groups (nested ones
	included), and risk. For those who may view the directory.
	"""
	principal(type: PrincipalType!, id: String!): PrincipalDetail!
	"""
	Resources whose ID or name contains `query`, ignoring case. At most 50.
	"""
	searchResources(query: String!): [ResourceSummary!]!
	"""
	One resource: its tiers and the classifier's reason, owner, sharing, the folders above it,
	and who is assigned to work that links it. Null when awzy-context doesn't know it.
	"""
	resource(id: String!): ResourceDetail
	"""
	A diagnostics bundle as JSON: each service's status, the portal's release, and which
	settings it was started with, with no client data. For those who may administer the
	enforcement area, to review before sending it to awzy support.
	"""
	diagnosticsBundle: JSONString!
	"""
	The repairs this install defines; empty where it defines none. For those who may
	administer the enforcement area.
	"""
	repairKinds: [RepairKind!]!
	"""
	Recent repair runs, newest first; a finished one is kept for a week. For those who may
	administer the enforcement area.
	"""
	repairRuns: [RepairRun!]!
}

input RegisterServiceAccountInput {
	"""
	Its ID in tokens: the `sub` of its own tokens, or `act.sub` when acting for a person.
	"""
	id: String!
	"""
	The accountable person's userName; must be provisioned by the IdP.
	"""
	owner: String!
