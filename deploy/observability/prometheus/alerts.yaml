# Alerts for whoever runs an install (ADR 0068). They encode the platform plan's targets; the
# local stack loads them into Prometheus, and the AWS monitoring module ships the same file.
groups:
  - name: awzy
    rules:
      - alert: AwzyServiceDown
        expr: up{job=~"awzy-.*"} == 0
        for: 5m
        labels: { severity: page }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzyservicedown-page"
          summary: "{{ $labels.job }} hasn't answered a scrape for 5 minutes"

      - alert: AwzyServiceNotReady
        expr: awzy_ready == 0
        for: 5m
        labels: { severity: page }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzyservicenotready-page"
          summary: "{{ $labels.job }} is up but not ready to take traffic"
          description: "A PDP stays not ready until it has loaded a signed bundle and the enforcement mode."

      - alert: AwzyPdpCheckLatencyHigh
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(awzy_pdp_check_duration_seconds_bucket[5m]))) > 0.01
        for: 10m
        labels: { severity: page }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzypdpchecklatencyhigh-page"
          summary: "PDP check p99 is {{ $value | humanizeDuration }}, over the 10 ms target"

      - alert: AwzyPdpCheckErrors
        expr: |
          sum(rate(awzy_pdp_check_errors_total[5m]))
            / clamp_min(sum(rate(awzy_pdp_check_errors_total[5m])) + sum(rate(awzy_pdp_decisions_total[5m])), 1e-9)
            > 0.01
        for: 5m
        labels: { severity: page }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzypdpcheckerrors-page"
          summary: "{{ $value | humanizePercentage }} of PDP checks are failing"

      - alert: AwzyServerErrors
        expr: |
          sum by (job) (rate(awzy_http_request_duration_seconds_count{status="5xx"}[5m]))
            / clamp_min(sum by (job) (rate(awzy_http_request_duration_seconds_count[5m])), 1e-9)
            > 0.05
        for: 10m
        labels: { severity: ticket }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzyservererrors-ticket"
          summary: "{{ $labels.job }} answers {{ $value | humanizePercentage }} of requests with a 5xx"

      # One awzy service refusing another: a caller missing from a group in the chart, or a method
      # no group names. Never expected between awzy's own services, so one is enough. Calls without
      # a token are left out: those can come from anywhere in the cluster.
      - alert: AwzyServiceCallRefused
        expr: sum by (job, route, reason, caller) (increase(awzy_service_calls_refused_total{reason!="unauthenticated"}[15m])) > 0
        labels: { severity: ticket }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzyservicecallrefused-ticket"
          summary: "{{ $labels.job }} refused {{ $labels.caller }} calling {{ $labels.route }} ({{ $labels.reason }})"
          description: "unlisted: no access rule names the method, so every caller is refused. not_allowed: the caller isn't in the route's group in the chart."

      # A step of awzy-reasoner's runs (every 15 minutes) that failed every time for an hour. A
      # failed step only waits for the next run, so this is the only sign: risk scores going
      # stale, nobody contained, or an empty Investigations page.
      - alert: AwzyReasonerStepFailing
        expr: |
          sum by (job, step) (increase(awzy_reasoner_steps_total{outcome="failed"}[1h])) > 0
          unless sum by (job, step) (increase(awzy_reasoner_steps_total{outcome="ok"}[1h])) > 0
        labels: { severity: ticket }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzyreasonerstepfailing-ticket"
          summary: "awzy-reasoner's {{ $labels.step }} step has failed every run for an hour"
          description: "awzy-reasoner's log says why, as a warning on each run."

  # The platform plan's freshness targets, as the PDP sees them.
  - name: awzy-freshness
    rules:
      - alert: AwzyPdpContainmentFeedStale
        expr: awzy_pdp_containment_feed_age_seconds > 2
        for: 1m
        labels: { severity: page }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzypdpcontainmentfeedstale-page"
          summary: "A PDP hasn't heard the containment feed for {{ $value | humanizeDuration }} (target: 2 s)"
          description: "Until it recovers, the PDP asks awzy-challenge on every check, which counts against the 10 ms budget."

      - alert: AwzyPdpPolicySyncStale
        expr: awzy_pdp_policy_sync_age_seconds > 60
        for: 2m
        labels: { severity: page }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzypdppolicysyncstale-page"
          summary: "A PDP last synced policy {{ $value | humanizeDuration }} ago (target: a published bundle live within 60 s)"

      - alert: AwzyPdpPrincipalsSyncStale
        expr: awzy_pdp_principals_sync_age_seconds > 60
        for: 2m
        labels: { severity: page }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzypdpprincipalssyncstale-page"
          summary: "A PDP last synced principals {{ $value | humanizeDuration }} ago (target: attribute changes within 60 s)"

      - alert: AwzyPdpResourceFeedStale
        expr: awzy_pdp_resource_feed_age_seconds > 60
        for: 2m
        labels: { severity: ticket }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzypdpresourcefeedstale-ticket"
          summary: "A PDP hasn't heard awzy-context's resource change log for {{ $value | humanizeDuration }}"
          description: "Cached resources fall back to expiring after 30 s until it recovers."

      - alert: AwzyPdpServingStaleResources
        expr: sum(rate(awzy_pdp_resource_lookups_total{served="stale"}[5m])) > 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzypdpservingstaleresources-ticket"
          summary: "PDPs are deciding on cached resources because awzy-context can't be reached"

      - alert: AwzyGatewayCantReachPdp
        expr: sum(rate(awzy_gateway_pdp_unreachable_total[5m])) > 0
        for: 1m
        labels: { severity: page }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzygatewaycantreachpdp-page"
          summary: "awzy-gateway can't reach awzy-pdp; tool calls are replayed or denied (ADR 0030)"


      # The release, from Argo CD's controller. Out of sync, the install keeps running the release
      # it has, but takes no newer one: no fixes, and no upgrade a channel asks for.
      - alert: AwzyReleaseNotSynced
        expr: max by (name) (argocd_app_info{name="awzy", sync_status!="Synced"}) == 1
        for: 30m
        labels: { severity: ticket }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzyreleasenotsynced-ticket"
          summary: "The install's release hasn't synced for 30 minutes: it's running an older release than its channel names"
          description: "Check `kubectl -n awzy-ops get application awzy`: a sync error, or a release waiting for a newer bootstrap (ADR 0098)."

      - alert: AwzyReleaseUnhealthy
        expr: max by (name, health_status) (argocd_app_info{name="awzy", health_status=~"Degraded|Missing"}) == 1
        for: 15m
        labels: { severity: page }
        annotations:
          runbook_url: "https://docs.awzysecurity.com/guides/monitoring/#awzyreleaseunhealthy-page"
          summary: "The install's release is {{ $labels.health_status }}: something it runs is failing or missing"
