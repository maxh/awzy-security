# Alerts for whoever runs an install (ADR 0066). They encode the platform plan's targets; the
# local stack loads them into Prometheus, and the AWS monitoring module ships the same file.
groups:
  - name: awzy
    rules:
      - alert: AwzyServiceDown
        expr: up{job=~"awzy-.*"} == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }} hasn't answered a scrape for 5 minutes"

      - alert: AwzyServiceNotReady
        expr: awzy_ready == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }} is up but not ready to take traffic"
          description: "A PDP stays not ready until it has loaded a signed bundle and the enforcement mode."

      - alert: AwzyPdpCheckLatencyHigh
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(awzy_pdp_check_duration_seconds_bucket[5m]))) > 0.01
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "PDP check p99 is {{ $value | humanizeDuration }}, over the 10 ms target"

      - alert: AwzyPdpCheckErrors
        expr: |
          sum(rate(awzy_pdp_check_errors_total[5m]))
            / clamp_min(sum(rate(awzy_pdp_check_errors_total[5m])) + sum(rate(awzy_pdp_decisions_total[5m])), 1e-9)
            > 0.01
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $value | humanizePercentage }} of PDP checks are failing"

      - alert: AwzyServerErrors
        expr: |
          sum by (job) (rate(awzy_http_request_duration_seconds_count{status="5xx"}[5m]))
            / clamp_min(sum by (job) (rate(awzy_http_request_duration_seconds_count[5m])), 1e-9)
            > 0.05
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.job }} answers {{ $value | humanizePercentage }} of requests with a 5xx"
