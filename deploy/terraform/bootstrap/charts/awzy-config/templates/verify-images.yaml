# awzy's namespaces run only awzy's images: each must come from the release registry (ADR 0057),
# carry a cosign signature from the release key (ADR 0009), and carry its SBOM as an attestation
# signed by the same key (ADR 0093). Third-party images there are mirrored into the registry and
# signed and attested like awzy's own. Signatures are not in the public Rekor log, so only the key
# is checked.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: awzy-verify-images
spec:
  webhookConfiguration:
    failurePolicy: Fail
  background: false
  rules:
    - name: signed-by-awzy-release-key
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces:
                {{- range $k, $ns := .Values.namespaces }}
                - {{ $ns }}
                {{- end }}
      verifyImages:
        - imageReferences: [{{ printf "%s/*" .Values.registry.prefix | quote }}]
          # Reject, not just report: without this Kyverno audits, and an unsigned image would run.
          failureAction: Enforce
          imageRegistryCredentials:
            secrets: [awzy-registry]
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                      {{- .Values.cosignPubKey | trim | nindent 22 }}
                    rekor: { ignoreTlog: true }
                    ctlog: { ignoreSCT: true }
          # An SPDX SBOM (cosign attest --type spdxjson), signed by the release key.
          attestations:
            - type: https://spdx.dev/Document
              attestors:
                - entries:
                    - keys:
                        publicKeys: |-
                          {{- .Values.cosignPubKey | trim | nindent 26 }}
                        rekor: { ignoreTlog: true }
                        ctlog: { ignoreSCT: true }
    - name: only-the-release-registry
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces:
                {{- range $k, $ns := .Values.namespaces }}
                - {{ $ns }}
                {{- end }}
      validate:
        failureAction: Enforce
        message: "awzy's namespaces run only images from {{ .Values.registry.prefix }} (ADR 0057)"
        pattern:
          spec:
            =(ephemeralContainers):
              - image: {{ printf "%s/*" .Values.registry.prefix | quote }}
            =(initContainers):
              - image: {{ printf "%s/*" .Values.registry.prefix | quote }}
            containers:
              - image: {{ printf "%s/*" .Values.registry.prefix | quote }}
