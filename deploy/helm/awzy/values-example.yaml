# Only for `helm lint` / `helm template` in CI; real values come from bootstrap.
image: { registry: 123456789012.dkr.ecr.us-east-2.amazonaws.com/awzy, tag: "0000000" }
postgres: { host: awzy.cluster-example.us-east-2.rds.amazonaws.com, secretRef: "arn:aws:secretsmanager:us-east-2:123456789012:secret:rds!cluster-example" }
