{{- if .Values.mcpGateway.enabled }}
{{- $sys := .Values.namespaces.system -}}
{{- $g := .Values.mcpGateway -}}
{{- $p := .Values.clientPortal -}}
{{- /* Tokens from the client's IdP, as the client portal validates them, unless set here. */ -}}
{{- $issuer := $g.auth.issuer | default $p.auth.issuer -}}
{{- $jwks := $g.auth.jwksUrl | default $p.auth.jwksUrl -}}
{{- if .Values.demoIdp.enabled }}
{{- $issuer = include "awzy.demoIdpIssuer" . -}}
{{- /* Through the Gateway: awzy fetches keys only over https. */ -}}
{{- $jwks = printf "%s/jwks" $issuer -}}
{{- end }}
{{- $token := dict "issuer" (required "mcpGateway.auth.issuer (or clientPortal.auth.issuer) is required" $issuer)
  "audience" $g.auth.audience "jwks_url" (required "mcpGateway.auth.jwksUrl (or clientPortal.auth.jwksUrl) is required" $jwks) -}}
{{- with ($g.auth.subjectClaim | default $p.auth.subjectClaim) }}{{- $_ := set $token "subject_claim" . }}{{- end }}
{{- $upstreams := $g.upstreams -}}
{{- if and .Values.demoData.enabled .Values.demoData.activity.enabled }}
{{- $drive := printf "http://larkspur-drive.%s.svc:8080" $sys -}}
{{- $upstreams = concat $upstreams (list
  (dict "name" "larkspur-drive" "url" (printf "%s/mcp" $drive)
    "resource_tools" (dict "read_document" (dict "argument" "id") "list_folder" (dict "argument" "id")))
  (dict "name" "larkspur-admin" "url" (printf "%s/admin/mcp" $drive))
) -}}
{{- end }}
{{- $config := dict "token" $token "upstreams" $upstreams "service_account_registry" "awzy-context"
  "outage" (dict "cached_allow_ttl_secs" (int $g.outage.cachedAllowTtlSecs)) -}}
{{- /* Where agents reach it, for the OAuth metadata MCP clients sign in with (ADR 0081). */ -}}
{{- with $g.hostname }}{{- $_ := set $config "public_url" (printf "https://%s" .) }}{{- end }}
{{- /* The client portal, so a challenged call links to the challenge to answer. */ -}}
{{- $portal := $p.publicUrl | default (ternary (printf "https://%s" $p.hostname) "" (ne $p.hostname "")) -}}
{{- with $portal }}{{- $_ := set $config "portal_url" . }}{{- end }}
# awzy-gateway: the MCP proxy agents call instead of each MCP server, checking every tool call
# with awzy-pdp (ADR 0019) and following awzy-challenge's containment feed for outages (ADR 0030).
# Service accounts come from awzy-context (ADR 0033). Each tool's tier, and which tiers fail open
# during an outage, come from awzy-policy, signed, as the client portal sets them (ADR 0089).
apiVersion: v1
kind: ConfigMap
metadata:
  name: awzy-gateway
  namespace: {{ $sys }}
  labels: {{- include "awzy.labels" (dict "root" . "name" "awzy-gateway") | nindent 4 }}
data:
  config.json: {{ toJson $config | quote }}
{{- $env := list
    (dict "name" "AWZY_CHALLENGE_ADDR" "value" (printf "http://awzy-challenge.%s.svc:8080" $sys))
    (dict "name" "AWZY_GATEWAY_CONFIG" "value" "/etc/awzy/gateway/config.json")
    (dict "name" "AWZY_PDP_ADDR" "value" (printf "http://awzy-pdp.%s.svc:8080" $sys))
    (dict "name" "AWZY_POLICY_ADDR" "value" (printf "http://awzy-policy.%s.svc:8080" $sys))
    (dict "name" "AWZY_POLICY_VERIFY_KEY_FILE" "value" "/var/run/secrets/awzy/policy-verify/verify.pem")
-}}
{{- /* Forwarded tool calls, recorded as activity (ADR 0084). */ -}}
{{- if .Values.intake.enabled }}
{{- $env = concat $env (list
    (dict "name" "AWZY_INTAKE_URL" "value" (printf "http://awzy-intake.%s.svc:8080" $sys))
    (dict "name" "AWZY_INTAKE_TOKEN" "valueFrom" (dict "secretKeyRef" (dict "name" .Values.intake.tokenSecret "key" "token")))
) }}
{{- end }}
---
{{ include "awzy.service" (dict "root" . "name" "awzy-gateway" "namespace" $sys "values" $g
  "tokens" (list "awzy-challenge" "awzy-pdp" "awzy-policy")
  "env" $env
  "volumes" (list (dict "name" "config" "configMap" (dict "name" "awzy-gateway"))
    (dict "name" "policy-verify" "secret" (dict "secretName" (required "policy.verifyKeySecret is required" .Values.policy.verifyKeySecret))))
  "mounts" (list (dict "name" "config" "mountPath" "/etc/awzy/gateway" "readOnly" true)
    (dict "name" "policy-verify" "mountPath" "/var/run/secrets/awzy/policy-verify" "readOnly" true))) }}
{{- if $g.hostname }}
---
# Agents outside the cluster reach it at https://<hostname>/mcp/<upstream>.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: awzy-gateway
  namespace: {{ $sys }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https-mcp
  hostnames: [{{ $g.hostname | quote }}]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /mcp }
        - path: { type: PathPrefix, value: /.well-known/oauth-protected-resource }
      backendRefs:
        - { name: awzy-gateway, port: 8080 }
{{- end }}
{{- end }}
