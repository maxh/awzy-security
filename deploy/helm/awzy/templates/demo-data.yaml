{{- if .Values.demoData.enabled }}
{{- $sys := .Values.namespaces.system }}
# DEMO INSTALLS ONLY (ADR 0039). Provisions the synthetic company (docs/plans/demo-plan.md) into
# awzy-context after each sync: people and groups over SCIM, then AI service accounts, then its
# resources and work items through the batch API; then the demo MCP servers' tool tiers into
# awzy-policy, unless the portal already has some (ADR 0089). Safe to run again; existing records
# are replaced.
apiVersion: batch/v1
kind: Job
metadata:
  name: awzy-synthetic
  namespace: {{ $sys }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      # Its own account, which awzy-context and awzy-policy let write on demo installs (ADR 0055).
      serviceAccountName: awzy-demo-data
      volumes:
        - name: awzy-service-tokens
          projected:
            sources:
              - serviceAccountToken: { audience: awzy-context, expirationSeconds: 600, path: awzy-context }
              - serviceAccountToken: { audience: awzy-policy, expirationSeconds: 600, path: awzy-policy }
      {{- with .Values.image.pullSecret }}
      imagePullSecrets: [{ name: {{ . }} }]
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # distroless's nonroot, by number: the image names its user, and the kubelet can't check
        # that a name isn't root, so it refuses to start the container.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: synthetic
          image: {{ include "awzy.image" (dict "root" . "name" "awzy-synthetic") }}
          args: [all, --profile, {{ .Values.demoData.profile | quote }}, --seed, {{ .Values.demoData.seed | quote }}]
          env:
            - { name: AWZY_CONTEXT_URL, value: "http://awzy-context.{{ $sys }}.svc:8080" }
            - { name: AWZY_LOG_FORMAT, value: {{ .Values.logFormat | quote }} }
            - { name: AWZY_POLICY_ADDR, value: "http://awzy-policy.{{ $sys }}.svc:8080" }
            - name: AWZY_SCIM_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.context.scimTokenSecret }}, key: token } }
          volumeMounts:
            - { name: awzy-service-tokens, mountPath: /var/run/secrets/awzy/tokens, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
{{- end }}
