{{- $sys := .Values.namespaces.system -}}
# Applies only bundles and mode changes awzy-policy signed (ADR 0080). A PDP that starts while
# awzy-policy, awzy-context, or awzy-challenge is down takes what it's missing from a running PDP
# (ADR 0119), which only the backend may ask.
{{ include "awzy.service" (dict "root" . "name" "awzy-pdp" "namespace" $sys "values" .Values.pdp
  "tokens" (list "awzy-challenge" "awzy-context" "awzy-pdp" "awzy-policy")
  "env" (list
    (dict "name" "AWZY_CHALLENGE_ADDR" "value" (printf "http://awzy-challenge.%s.svc:8080" $sys))
    (dict "name" "AWZY_KAFKA_BROKERS" "value" (required "kafka.brokers is required" .Values.kafka.brokers))
    (dict "name" "AWZY_KAFKA_TLS" "value" (toString .Values.kafka.tls))
    (dict "name" "AWZY_MAX_CONNECTION_AGE_SECS" "value" (toString .Values.pdp.maxConnectionAgeSeconds))
    (dict "name" "AWZY_PDP_CONTAINMENTS_MAX_STALE_SECS" "value" (toString .Values.pdp.containmentsMaxStaleSeconds))
    (dict "name" "AWZY_PDP_PEERS" "value" (printf "%s/awzy" $sys))
    (dict "name" "AWZY_PDP_PEER_ADDR" "value" (printf "awzy-pdp-peers.%s.svc:8080" $sys))
    (dict "name" "AWZY_POLICY_ADDR" "value" (printf "http://awzy-policy.%s.svc:8080" $sys))
    (dict "name" "AWZY_POLICY_VERIFY_KEY_FILE" "value" "/var/run/secrets/awzy/policy-verify/verify.pem")
    (dict "name" "AWZY_CONTEXT_ADDR" "value" (printf "http://awzy-context.%s.svc:8080" $sys))
  )
  "volumes" (list (dict "name" "policy-verify" "secret" (dict "secretName" (required "policy.verifyKeySecret is required" .Values.policy.verifyKeySecret))))
  "mounts" (list (dict "name" "policy-verify" "mountPath" "/var/run/secrets/awzy/policy-verify" "readOnly" true))
) }}
---
# The PDPs' own addresses, for a starting PDP to find running ones (ADR 0119). Headless, so it
# resolves to each pod; only ready pods are listed, so a PDP never finds itself.
apiVersion: v1
kind: Service
metadata:
  name: awzy-pdp-peers
  namespace: {{ $sys }}
  labels: {{- include "awzy.labels" (dict "root" . "name" "awzy-pdp-peers") | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "awzy.selector" (dict "name" "awzy-pdp") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
