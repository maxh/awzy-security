# Copies the RDS-managed credentials from the cloud's secret store and builds the connection
# URL awzy services read from AWZY_POSTGRES_URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: awzy-postgres
  namespace: {{ .Values.namespaces.system }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # before the database Job and the services
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.postgres.secretStore }}
  target:
    name: awzy-postgres
    template:
      data:
        # The server's default database, for the database Job that creates the others.
        admin_url: 'postgres://{{ "{{" }} .username {{ "}}" }}:{{ "{{" }} .password | urlquery {{ "}}" }}@{{ required "postgres.host is required" .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}?sslmode=require'
        # Each service's own database: each runs its own migrations, so they can't share.
        policy_url: 'postgres://{{ "{{" }} .username {{ "}}" }}:{{ "{{" }} .password | urlquery {{ "}}" }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.policyDatabase }}?sslmode=require'
        challenge_url: 'postgres://{{ "{{" }} .username {{ "}}" }}:{{ "{{" }} .password | urlquery {{ "}}" }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.challengeDatabase }}?sslmode=require'
        context_url: 'postgres://{{ "{{" }} .username {{ "}}" }}:{{ "{{" }} .password | urlquery {{ "}}" }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.contextDatabase }}?sslmode=require'
  data:
    - secretKey: username
      remoteRef: { key: {{ required "postgres.secretRef is required" .Values.postgres.secretRef | quote }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ .Values.postgres.secretRef | quote }}, property: password }
