{{- $sys := .Values.namespaces.system -}}
{{- $p := .Values.clientPortal -}}
{{- $issuer := $p.auth.issuer -}}
{{- $jwks := $p.auth.jwksUrl -}}
{{- if .Values.demoIdp.enabled }}
{{- $issuer = include "awzy.demoIdpIssuer" . -}}
{{- /* Through the Gateway: awzy fetches keys only over https. */ -}}
{{- $jwks = printf "%s/jwks" $issuer -}}
{{- end }}
{{- $env := list
  (dict "name" "AWZY_AUTH_ISSUER" "value" (required "clientPortal.auth.issuer is required" $issuer))
  (dict "name" "AWZY_AUTH_JWKS_URL" "value" (required "clientPortal.auth.jwksUrl is required" $jwks))
  (dict "name" "AWZY_AUTH_AUDIENCE" "value" $p.auth.audience)
  (dict "name" "AWZY_AUTH_CLIENT_ID" "value" $p.auth.clientId)
  (dict "name" "AWZY_MCP_AUDIENCE" "value" $p.auth.mcpAudience)
  (dict "name" "AWZY_CHALLENGE_ADDR" "value" (printf "http://awzy-challenge.%s.svc:8080" $sys))
  (dict "name" "AWZY_CONTEXT_ADDR" "value" (printf "http://awzy-context.%s.svc:8080" $sys))
  (dict "name" "AWZY_PDP_ADDR" "value" (printf "http://awzy-pdp.%s.svc:8080" $sys))
  (dict "name" "AWZY_POLICY_ADDR" "value" (printf "http://awzy-policy.%s.svc:8080" $sys))
  (dict "name" "AWZY_PORTAL_PERSISTED_QUERIES_ONLY" "value" (ternary "true" "false" (ne $p.persistedQueriesOnly false)))
-}}
{{- /* The connectors' status, and where to write their credentials (ADR 0104). */ -}}
{{- if .Values.connectors.enabled }}
{{- $env = append $env (dict "name" "AWZY_CONNECTORS_ADDR" "value" (printf "http://awzy-connectors.%s.svc:8080" $sys)) }}
{{- with .Values.connectors.drive.secretRef }}{{- $env = append $env (dict "name" "AWZY_PORTAL_DRIVE_SECRET" "value" .) }}{{- end }}
{{- with .Values.connectors.jira.secretRef }}{{- $env = append $env (dict "name" "AWZY_PORTAL_JIRA_SECRET" "value" .) }}{{- end }}
{{- end }}
{{- /* Without it, the portal shows that nothing is sent to awzy. */ -}}
{{- if .Values.reporter.enabled }}
{{- $env = append $env (dict "name" "AWZY_REPORTER_ADDR" "value" (printf "http://awzy-reporter.%s.svc:8080" $sys)) }}
{{- end }}
{{- /* Where the repairs a client admin can start live (ADR 0102); without it, none can. */ -}}
{{- if .Values.clickhouse.enabled }}
{{- $env = append $env (dict "name" "AWZY_PORTAL_REPAIRS_NAMESPACE" "value" .Values.namespaces.data) }}
{{- end }}
{{- if $p.publicUrl }}
{{- $env = append $env (dict "name" "AWZY_PORTAL_PUBLIC_URL" "value" $p.publicUrl) }}
{{- end }}
{{- /* Anyone can sign in to a demo, so by default it changes nothing. */ -}}
{{- $readOnly := .Values.demoIdp.enabled }}
{{- if ne $p.readOnly nil }}{{- $readOnly = $p.readOnly }}{{- end }}
{{- if $readOnly }}
{{- $env = append $env (dict "name" "AWZY_PORTAL_READ_ONLY" "value" "true") }}
{{- end }}
{{- if $p.auth.subjectClaim }}
{{- $env = append $env (dict "name" "AWZY_AUTH_SUBJECT_CLAIM" "value" $p.auth.subjectClaim) }}
{{- end }}
{{- /* The MCP endpoint accepts only these Host headers (DNS-rebinding protection); without one, only loopback. */ -}}
{{- if $p.hostname }}
{{- $env = append $env (dict "name" "AWZY_MCP_ALLOWED_HOSTS" "value" $p.hostname) }}
{{- end }}
{{- if $p.awzyBot.enabled }}
{{- $env = append $env (dict "name" "AWZY_BOT_ENABLED" "value" "true") }}
{{- $env = concat $env (include "awzy.modelServiceEnv" (dict "root" . "component" $p.awzyBot "what" "Awzy Bot") | fromYamlArray) }}
{{- end }}
{{- /* Its MCP calls, recorded as activity (ADR 0084); the token's Secret is in its namespace too. */ -}}
{{- if .Values.intake.enabled }}
{{- $env = concat $env (list
  (dict "name" "AWZY_INTAKE_URL" "value" (printf "http://awzy-intake.%s.svc:8080" $sys))
  (dict "name" "AWZY_INTAKE_TOKEN" "valueFrom" (dict "secretKeyRef" (dict "name" .Values.intake.tokenSecret "key" "token")))
) }}
{{- end }}
{{- if .Values.clickhouse.enabled }}
{{- $env = concat $env (list
  (dict "name" "AWZY_CLICKHOUSE_URL" "value" (printf "http://clickhouse-awzy.%s.svc:8123" .Values.namespaces.data))
  (dict "name" "AWZY_CLICKHOUSE_USER" "value" .Values.clickhouse.user)
  (dict "name" "AWZY_CLICKHOUSE_DATABASE" "value" .Values.clickhouse.database)
  (dict "name" "AWZY_CLICKHOUSE_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" .Values.clickhouse.passwordSecret "key" "password")))
) }}
{{- end }}
{{- /* Support sessions (ADR 0095): awzy staff sign in with the corp portal's token for this install. */ -}}
{{- $volumes := list -}}
{{- $mounts := list -}}
{{- with $p.supportPublicKey }}
{{- $env = concat $env (list
  (dict "name" "AWZY_INSTALL_ID" "value" (required "reporter.installId is required for support sessions" $.Values.reporter.installId))
  (dict "name" "AWZY_SUPPORT_PUBLIC_KEY_FILE" "value" "/etc/awzy/support/support.pub")
) }}
{{- $volumes = list (dict "name" "support" "configMap" (dict "name" "awzy-support-key")) }}
{{- $mounts = list (dict "name" "support" "mountPath" "/etc/awzy/support" "readOnly" true) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: awzy-support-key
  namespace: {{ $.Values.namespaces.portal }}
data:
  support.pub: {{ . | quote }}
{{- end }}
---
{{ include "awzy.service" (dict "root" . "name" "awzy-client-portal" "namespace" .Values.namespaces.portal "values" $p "env" $env
  "tokens" (list "awzy-challenge" "awzy-context" "awzy-pdp" "awzy-policy") "volumes" $volumes "mounts" $mounts) }}
