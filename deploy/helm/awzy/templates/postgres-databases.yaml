# Creates databases that aren't the server's default before the services that use them start
# (sync wave -1, after the credentials in wave -2). Safe to run on every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: awzy-postgres-databases
  namespace: {{ .Values.namespaces.system }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # A hook, like the other Jobs: Argo CD deletes it and creates it anew each sync. Replacing a
    # Job in place fails, since its selector is generated and its template can't change.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      {{- with .Values.image.pullSecret }}
      imagePullSecrets: [{ name: {{ . }} }]
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres in the alpine image
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: create
          image: {{ include "awzy.thirdPartyImage" (dict "root" . "ref" "postgres:17-alpine-b0f9560a2de0") }}
          command:
            - sh
            - -c
            - |
              set -eu
              for db in $DATABASES; do
                if psql "$URL" -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1; then
                  echo "$db exists"
                else
                  psql "$URL" -c "CREATE DATABASE $db" && echo "created $db"
                fi
              done
          env:
            - name: URL
              valueFrom: { secretKeyRef: { name: awzy-postgres, key: admin_url } }
            - { name: DATABASES, value: {{ printf "%s %s %s" .Values.postgres.challengeDatabase .Values.postgres.contextDatabase .Values.postgres.policyDatabase | quote }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
