{{- $sys := .Values.namespaces.system -}}
{{- $backend := printf "%s/awzy" $sys -}}
{{- $portal := printf "%s/awzy" .Values.namespaces.portal -}}
# awzy-challenge: challenges and containments (ADR 0054). In-cluster only: the PDP resolves
# challenges and follows the containment feed; the client portal answers and manages them.
# Who may call which methods (ADR 0055): the PDPs resolve and follow; only the portal answers for
# a person; the portal and the backend (awzy-reasoner, ADR 0066) contain, lift, and list; and
# awzy-policy, under its own account, reports break-glass rollbacks; and awzy-reporter brings in
# support session requests (ADR 0095).
{{- $env := list
    (dict "name" "AWZY_CHALLENGE_ANSWERERS" "value" $portal)
    (dict "name" "AWZY_CHALLENGE_CONTAINERS" "value" (printf "%s,%s" $backend $portal))
    (dict "name" "AWZY_CHALLENGE_GRANT_SECS" "value" (toString .Values.challenge.grantSeconds))
    (dict "name" "AWZY_CHALLENGE_PDPS" "value" $backend)
    (dict "name" "AWZY_CHALLENGE_PENDING_SECS" "value" (toString .Values.challenge.pendingSeconds))
    (dict "name" "AWZY_CHALLENGE_POLICY" "value" (printf "%s/awzy-policy" $sys))
    (dict "name" "AWZY_CHALLENGE_REPORTERS" "value" (printf "%s/awzy-reporter" $sys))
    (dict "name" "AWZY_PDP_ADDR" "value" (printf "http://awzy-pdp.%s.svc:8080" $sys))
    (dict "name" "AWZY_POSTGRES_URL" "valueFrom" (dict "secretKeyRef" (dict "name" "awzy-postgres" "key" "challenge_url")))
    (dict "name" "AWZY_POSTGRES_MIGRATE" "value" "check")
-}}
{{- /* Security keys (ADR 0059) are bound to the portal's hostname; without one they stay off. */}}
{{- with .Values.clientPortal.hostname }}
{{- $origin := $.Values.clientPortal.publicUrl | default (printf "https://%s" .) | trimSuffix "/" }}
{{- $env = append $env (dict "name" "AWZY_CHALLENGE_WEBAUTHN_ORIGINS" "value" $origin) }}
{{- $env = append $env (dict "name" "AWZY_CHALLENGE_WEBAUTHN_RP_ID" "value" .) }}
{{- end }}
{{- /* Telling people what's waiting for them (ADR 0073, 0122): in the client's Slack, with a
bot-token Secret and the security team's channel; and by email, with a Secret holding the SMTP
relay's URL, a sender, and the security team's address. Links go to the portal's public URL. */}}
{{- $slack := and .Values.challenge.slack.tokenSecret .Values.challenge.slack.securityChannel }}
{{- $email := and .Values.challenge.email.relaySecret .Values.challenge.email.from .Values.challenge.email.securityAddress }}
{{- if or $slack $email }}
{{- $url := .Values.clientPortal.publicUrl | default (printf "https://%s" (required "clientPortal.hostname or publicUrl is required for notifications" .Values.clientPortal.hostname)) | trimSuffix "/" }}
{{- $env = concat $env (list
  (dict "name" "AWZY_CHALLENGE_CONTEXT_ADDR" "value" (printf "http://awzy-context.%s.svc:8080" $sys))
  (dict "name" "AWZY_CHALLENGE_PORTAL_URL" "value" $url)
) }}
{{- end }}
{{- with .Values.challenge.slack }}{{- if $slack }}
{{- $env = concat $env (list
  (dict "name" "AWZY_CHALLENGE_SLACK_SECURITY_CHANNEL" "value" .securityChannel)
  (dict "name" "AWZY_CHALLENGE_SLACK_TOKEN" "valueFrom" (dict "secretKeyRef" (dict "name" .tokenSecret "key" "token")))
) }}
{{- end }}{{- end }}
{{- with .Values.challenge.email }}{{- if $email }}
{{- $env = concat $env (list
  (dict "name" "AWZY_CHALLENGE_EMAIL_FROM" "value" .from)
  (dict "name" "AWZY_CHALLENGE_EMAIL_RELAY_URL" "valueFrom" (dict "secretKeyRef" (dict "name" .relaySecret "key" "url")))
  (dict "name" "AWZY_CHALLENGE_EMAIL_SECURITY_ADDRESS" "value" .securityAddress)
) }}
{{- end }}{{- end }}
{{ include "awzy.service" (dict "root" . "name" "awzy-challenge" "namespace" $sys "values" .Values.challenge
  "tokens" (list "awzy-context" "awzy-pdp") "env" $env) }}
