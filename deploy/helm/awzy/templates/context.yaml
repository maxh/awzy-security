{{- $sys := .Values.namespaces.system -}}
{{- $backend := printf "%s/awzy" $sys -}}
{{- $portal := printf "%s/awzy" .Values.namespaces.portal -}}
{{- /* Demo installs: the synthetic company's Job writes its resources (ADR 0063) and registers
its AI service accounts, which is the directory's API. */ -}}
{{- $writers := $backend -}}
{{- $directory := printf "%s,%s" $backend $portal -}}
{{- if .Values.demoData.enabled }}
{{- $writers = printf "%s,%s/awzy-demo-data" $backend $sys -}}
{{- $directory = printf "%s,%s/awzy-demo-data" $directory $sys -}}
{{- end }}
{{- /* The synthetic company's teams (authz/demo/synthetic), unless the install names its own. */ -}}
{{- $teams := .Values.context.teamGroups -}}
{{- if and (not $teams) .Values.demoData.enabled }}
{{- $teams = "contractors-*,engineering-*,executive,finance,hr,it-admin,legal,sales-*,security,strategy,support" -}}
{{- end }}
# awzy-context: people and groups from the client's IdP over SCIM (ADR 0031), served to the PDP
# at /v1/principals. Only /scim/v2 is public, through the Gateway; the rest is in-cluster, and
# needs a service token from a caller its group allows (ADR 0055): the install's backend
# (`awzy` in the system namespace) and, for reading and the directory, the client portal.
{{ include "awzy.service" (dict "root" . "name" "awzy-context" "namespace" $sys "values" .Values.context
  "env" (list
    (dict "name" "AWZY_CONTEXT_DIRECTORY" "value" $directory)
    (dict "name" "AWZY_CONTEXT_READERS" "value" (printf "%s,%s" $backend $portal))
    (dict "name" "AWZY_CONTEXT_TEAM_GROUPS" "value" $teams)
    (dict "name" "AWZY_CONTEXT_WRITERS" "value" $writers)
    (dict "name" "AWZY_POSTGRES_URL" "valueFrom" (dict "secretKeyRef" (dict "name" "awzy-postgres" "key" "context_url")))
    (dict "name" "AWZY_POSTGRES_MIGRATE" "value" "check")
    (dict "name" "AWZY_SCIM_TOKEN" "valueFrom" (dict "secretKeyRef" (dict "name" .Values.context.scimTokenSecret "key" "token")))
  )) }}
{{- if .Values.clientPortal.hostname }}
---
# Okta and Entra call SCIM from their own cloud, so it is public, on the portal's hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: awzy-context-scim
  namespace: {{ $sys }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https
  hostnames: [{{ .Values.clientPortal.hostname | quote }}]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /scim/v2 }
      backendRefs:
        - { name: awzy-context, port: 8080 }
{{- end }}
