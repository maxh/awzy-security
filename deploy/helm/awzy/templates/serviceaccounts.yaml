# Workload identity is bound to these names outside the chart (EKS Pod Identity, GKE Workload
# Identity), so they are part of install_contract and must not change.
{{- range $ns := list .Values.namespaces.system .Values.namespaces.portal }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # Before the migration and database Jobs (sync hooks at wave -1), which run as these.
    argocd.argoproj.io/sync-wave: "-2"
  name: awzy
  namespace: {{ $ns }}
{{- end }}
---
# awzy-policy's own account: its cloud role alone may sign with the install's policy signing key
# (ADR 0092).
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # Before the migration and database Jobs (sync hooks at wave -1), which run as these.
    argocd.argoproj.io/sync-wave: "-2"
  name: awzy-policy
  namespace: {{ .Values.namespaces.system }}
{{- if .Values.demoData.enabled }}
---
# DEMO INSTALLS ONLY: the synthetic company's provisioning Job, which awzy-context and awzy-policy
# let write (ADR 0055), so no service of the install's own needs that.
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # Before the migration and database Jobs (sync hooks at wave -1), which run as these.
    argocd.argoproj.io/sync-wave: "-2"
  name: awzy-demo-data
  namespace: {{ .Values.namespaces.system }}
{{- end }}
{{- if .Values.clickhouse.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # Before the migration and database Jobs (sync hooks at wave -1), which run as these.
    argocd.argoproj.io/sync-wave: "-2"
  name: clickhouse
  namespace: {{ .Values.namespaces.data }}
{{- end }}
---
# Services that check callers' tokens (ADR 0055) read the cluster's signing keys at
# /openid/v1/jwks, which the API server serves to this role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: awzy-service-account-issuer-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - { kind: ServiceAccount, name: awzy, namespace: {{ .Values.namespaces.system }} }
  - { kind: ServiceAccount, name: awzy-policy, namespace: {{ .Values.namespaces.system }} }
