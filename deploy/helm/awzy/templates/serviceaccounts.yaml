# Workload identity is bound to these names outside the chart (EKS Pod Identity, GKE Workload
# Identity), so they are part of install_contract and must not change.
{{- range $ns := list .Values.namespaces.system .Values.namespaces.portal }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: awzy
  namespace: {{ $ns }}
{{- end }}
{{- if .Values.clickhouse.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse
  namespace: {{ .Values.namespaces.data }}
{{- end }}
