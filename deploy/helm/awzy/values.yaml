# Values come from bootstrap, which maps install_contract onto them (deploy/terraform/bootstrap).
# Namespaces and the ClickHouse credentials Secret are created by bootstrap, not this chart.

# What the release needs from bootstrap (ADR 0098). `level` is set by bootstrap; `required` belongs
# to the chart: an install whose bootstrap is older than this release needs installs nothing new,
# keeps running the release it has, and says what to apply.
bootstrap:
  level: 0 # a bootstrap that predates the check passes none
  # 1: the policy signing key is the cloud layer's KMS key (#157)
  # 2: metrics-server, which the autoscalers below read CPU from (#66)
  # 3: the connectors' credentials in the cloud's secrets manager, in place of bootstrap's Secrets
  #    (ADR 0104)
  required: 4

image:
  # install_contract.registry_prefix, e.g. 123456789012.dkr.ecr.us-east-2.amazonaws.com/awzy
  registry: ""
  # Defaults to the chart's appVersion, the commit SHA the images were built from.
  tag: ""
  # dockerconfigjson Secret in each awzy namespace with the install's pull token for
  # registry.awzysecurity.com (ADR 0028, created by bootstrap). Empty: no pull secret.
  pullSecret: awzy-registry

namespaces:
  system: awzy-system
  data: awzy-data
  portal: awzy-portal

postgres:
  host: ""
  port: 5432
  # The server's default database (Terraform creates it). Only the chart's database Job uses it,
  # to create each service's own database below.
  database: awzy
  # Each service's own database on the same server, created by the chart's database Job.
  challengeDatabase: awzy_challenge
  contextDatabase: awzy_context
  policyDatabase: awzy_policy
  # Secrets Manager secret (RDS-managed master credentials); External Secrets copies it.
  secretRef: ""
  # ClusterSecretStore created by bootstrap.
  secretStore: awzy

kafka:
  brokers: "" # comma-separated host:port
  # Speak TLS to the brokers: awzy's services and ClickHouse's Kafka engine alike. Installs set
  # it (MSK serves TLS on its own port, so the brokers change with it); the local stack doesn't.
  tls: false

clickhouse:
  enabled: true
  storageClass: gp3
  storageSize: 20Gi
  database: awzy
  user: awzy
  # Secret in the data and portal namespaces with key "password" (created by bootstrap).
  passwordSecret: awzy-clickhouse
  # awzy-reporter's read-only user (ADR 0042): disk sizes and Kafka consumer positions only.
  # Secret in the data and system namespaces with key "password" (created by bootstrap).
  reporterPasswordSecret: awzy-clickhouse-reporter
  # awzy-reasoner's read-only user (ADR 0056): decisions and events only.
  # Secret in the data and system namespaces with key "password" (created by bootstrap).
  reasonerPasswordSecret: awzy-clickhouse-reasoner
  # How many days decisions and events are kept before they expire; 0 keeps them all. Applied on
  # every sync, so it can change after install.
  retentionDays: 0
  # Backups of decisions and events with ClickHouse's own BACKUP (ADR 0105), to an S3-compatible
  # URL ClickHouse's own workload identity may write (bootstrap sets the install's bucket). Each
  # run backs up in full if its week (ISO, UTC) has no full backup yet, and otherwise only what
  # changed since that one. The bucket expires them. Empty: no backups.
  backup:
    url: ""
    schedule: "17 3 * * *" # daily, UTC

pdp:
  replicas: 2 # the minimum when autoscaling
  # A HorizontalPodAutoscaler adds replicas, up to maxReplicas, to keep average CPU near cpuPercent
  # of the request. It reads CPU from metrics-server, which bootstrap installs.
  autoscaling:
    enabled: true
    maxReplicas: 4
    cpuPercent: 70
  # Each connection is closed gracefully after about this long, and its client reconnects. A
  # Service spreads connections, not requests, so this is how enforcement points' checks reach
  # PDPs the autoscaler adds. 0 keeps connections open.
  maxConnectionAgeSeconds: 60
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { memory: 512Mi }

policy:
  replicas: 2
  # awzy-policy signs every bundle, enforcement mode change, and outage fallback with this KMS key
  # (an AWS KMS ARN, or a Cloud KMS key version name), which only awzy-policy's account may use;
  # the private key never leaves KMS (ADR 0092). The PDPs and gateways apply only what verifies against a public key in the other secret
  # (`verify.pem`: one or more PEM keys, so a new key can be trusted before it signs). Bootstrap
  # sets both from install_contract.
  signingKmsKey: ""
  verifyKeySecret: awzy-policy-verify
  # The public keys of the admins enrolled for break-glass rollback (`keys.pem`, one or more PEM
  # keys). Empty turns break-glass off.
  breakGlassKeysSecret: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

clientPortal:
  replicas: 2 # the minimum when autoscaling
  autoscaling:
    enabled: true
    maxReplicas: 3
    cpuPercent: 70
  # The client's IdP (required: the portal refuses to start without one).
  auth:
    issuer: ""
    jwksUrl: ""
    # The `aud` of the portal's own tokens, and of those agents get for its MCP endpoint, kept
    # apart so a token handed to an agent doesn't open the portal's API (ADR 0081).
    audience: awzy
    mcpAudience: awzy-mcp
    clientId: awzy-client-portal
    # The claim holding the person's SCIM userName, when `sub` doesn't (an opaque ID, as with
    # Entra): e.g. email. Empty: sub.
    subjectClaim: ""
  publicUrl: ""
  # The corp portal's public key for support session tokens (PEM; ADR 0095). awzy staff sign in
  # with one only while a session your admin approved lasts. Empty: support sessions can't sign in.
  supportPublicKey: ""
  # GraphQL runs only the portal's own pages' queries (ADR 0088). Only awzy's own staging and demo
  # installs turn it off, so a local frontend can run against them (ADR 0024).
  persistedQueriesOnly: true
  # Refuse every change (GraphQL mutations, and the MCP tools that change something), so whoever
  # signs in can look at everything but alter nothing. Empty: on exactly when demoIdp is, since
  # anyone can sign in to a demo. An install of awzy's own that needs changes sets false.
  readOnly: ~
  # Public hostname; when set, the portal is served through the Gateway below.
  hostname: ""
  # Awzy Bot (ADR 0048): the Policies page's assistant, with the model its `awzy_bot` route in
  # `models` names.
  awzyBot:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

# The heartbeat to the corp portal (ADR 0026): versions, readiness, and a few aggregates of the
# awzy services, nothing free-form. Register the install in the corp portal to get its ID and
# reporting token. Set enabled: false to send nothing.
reporter:
  enabled: true
  installId: "" # install_<uuid>, from the corp portal
  # Secret in the system namespace with key "token" (the reporting token, created by bootstrap).
  tokenSecret: awzy-reporting-token
  corpUrl: https://corp.awzysecurity.com
  intervalSeconds: 60
  # The Argo CD Application that installs this chart (bootstrap makes it): the heartbeat says
  # whether the release synced and its health, as closed values. Empty name: not read.
  releaseApplication: { namespace: awzy-ops, name: awzy }
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

# Models for Awzy Bot and investigations (ADR 0114). Bootstrap sets these.
models:
  # What the install can reach, by name: { kind: bedrock, region }, { kind: vertex, project,
  # region }, { kind: openai, url, api_key_env }, or { kind: anthropic, api_key_env }. A route can
  # only use these, so settings never send prompts anywhere the install wasn't set up for.
  connections: {}
  # The catalog and the routes to start with, until they're set in the client portal: { models:
  # [{ name, connection, model, cache, params }], routes: { awzy_bot: { targets: [{ model, weight }],
  # fallback: [] }, investigations: … } }.
  routing: {}
  # Environment variables the connections' api_key_env name, from Secrets in each service's
  # namespace: { AWZY_LLM_KEY_AZURE: { secret: azure-openai, key: api-key } }.
  apiKeySecrets: {}

# awzy-reasoner: risk scores from ClickHouse activity, written to awzy-context (ADR 0056).
reasoner:
  enabled: true
  intervalSeconds: 900
  replicas: 1
  # Investigations (ADR 0071): a model, by the `investigations` route in `models`, looks into
  # the people the reasoner flags.
  investigations:
    enabled: false
    # The most tokens a calendar month may spend on investigations.
    monthlyTokens: 2000000
    # Members are only ever proposed for containment, never contained automatically.
    privilegedGroups: [it, security]
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# awzy-challenge: challenges and containments. Each PDP follows its containment feed.
challenge:
  replicas: 2
  # How long a challenge waits for an answer (and a rejection blocks the request), and how long
  # a passed one allows the request. Seconds.
  pendingSeconds: 86400
  grantSeconds: 900
  # Slack (ADR 0073): people are told what's waiting for them, and the security team about
  # approvals and containments. Off until both are set: a Secret in the system namespace with key
  # "token" (the bot token of the Slack app the client installed, with the users:read.email and
  # chat:write scopes), and the security team's channel ID.
  slack:
    tokenSecret: ""
    securityChannel: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

context:
  replicas: 2
  # Secret in the system namespace with key "token": the SCIM bearer token the client's IdP
  # uses (created by bootstrap).
  scimTokenSecret: awzy-scim-token
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

# Pods allowed to reach the PDP. Enforcement points can run anywhere in the cluster (or call
# through a private endpoint), so it accepts any in-cluster source.
# awzy-gateway (ADR 0019): the MCP proxy agents call. Tokens are validated against the client
# portal's IdP unless auth is set here. Off until there's an upstream MCP server to front.
mcpGateway:
  enabled: false
  replicas: 2 # the minimum when autoscaling
  autoscaling:
    enabled: true
    maxReplicas: 4
    cpuPercent: 70
  # Public hostname for agents outside the cluster: https://<hostname>/mcp/<upstream>. Empty: in-cluster only.
  hostname: ""
  # Tokens from the client portal's IdP unless set here, for an audience of their own (ADR 0081).
  auth:
    issuer: ""
    jwksUrl: ""
    audience: awzy-gateway
    subjectClaim: "" # default: the client portal's
  # Each: { name, url, resource_tools: {...} }. Each tool's tier, and which tiers fail open during
  # a PDP outage, are set in the client portal's Enforcement page (ADR 0089).
  upstreams: []
  outage:
    cachedAllowTtlSecs: 300
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

# awzy-intake: events from apps and audit logs onto Kafka. Secret in the system namespace with
# key "token" (at least 32 characters), which sources send.
intake:
  enabled: false
  replicas: 2
  tokenSecret: awzy-intake-token
  eventsTopic: awzy.events.v1
  # AWS roles, besides IAM Identity Center's, whose CloudTrail sessions are people: the session
  # name is the person's user name as the IdP federates it (ADR 0086).
  humanRoles: []
  # Public hostname for sources outside the cluster: https://<hostname>/v1/events. Empty: in-cluster only.
  hostname: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

# awzy-connectors (ADR 0104): one replica, always deployed. A client admin configures Drive and
# Jira in the client portal; their credentials come from the cloud's secrets manager, which
# bootstrap names here.
connectors:
  enabled: true
  drive:
    secretRef: "" # the Google service account key's secret
  jira:
    secretRef: "" # the API token's secret
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

networkPolicies:
  enabled: true
  # Namespace of the Gateway's Envoy proxies (Envoy Gateway's default).
  gatewayNamespace: envoy-gateway-system

# DEMO INSTALLS ONLY (ADR 0039): provisions Larkspur Capital, the synthetic company in
# docs/plans/demo-plan.md, into awzy-context after each sync. Sample data only.
demoData:
  enabled: false
  profile: demo # demo (~200 people) or scale (~10,000)
  seed: 1
  # Everyday tool calls through awzy-gateway, so the demo has decisions to show: larkspur-drive
  # and larkspur-admin as the gateway's upstreams, and `awzy-synthetic activity` on a schedule,
  # signing as the demo IdP. Needs demoIdp and mcpGateway.
  activity:
    enabled: false
    schedule: "0 13 * * 1-5" # one generated workday, each weekday morning (UTC)
    rate: 5 # tool calls per second
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }

# DEMO INSTALLS ONLY (ADR 0032): runs the dev IdP at https://<clientPortal.hostname>/idp and
# signs the client portal in against it. Anyone who can reach it can sign in as a sample user,
# and its signing key is public. Never on an install with real data.
demoIdp:
  enabled: false
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

# The install's Gateway, created by bootstrap.
gateway:
  name: awzy
  namespace: awzy-ops

# Seconds a pod keeps serving after SIGTERM, not ready, so traffic moves before it stops (ADR 0072).
shutdownDelaySeconds: 10

logFormat: json

# OpenTelemetry traces from every service (ADR 0097), over OTLP gRPC to your collector, e.g.
# http://otel-collector.observability.svc:4317. Empty: no traces. sampleRatio is the share sent
# (1: all, so the collector can keep the slow ones).
tracing:
  otlpEndpoint: ""
  sampleRatio: 1
