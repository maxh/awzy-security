[workspace]
resolver = "2"
members = [
    "libs/cloud",
    "libs/heartbeat",
    "libs/portal",
    "libs/llm",
    "libs/model",
    "libs/server",
    "libs/store",
    "libs/telemetry",
    "tools/dev-idp",
    "authz/libs/activity",
    "authz/libs/proto",
    "authz/services/challenge",
    "authz/demo/evals",
    "authz/demo/synthetic",
    "authz/jobs/clickhouse-migrate",
    "authz/services/connectors",
    "authz/services/context",
    "authz/services/gateway",
    "authz/libs/identity",
    "authz/services/intake",
    "authz/services/pdp",
    "authz/services/policy",
    "authz/services/reasoner",
    "authz/services/reporter",
    "authz/libs/signing",
    "authz/libs/classify",
    "authz/libs/service-auth",
    "portals/client/backend",
    "portals/corp/backend",
    "portals/corp/registry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest", "sso", "credentials-process"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The AWS SDK's HTTPS client on ring, the crypto the rest of the workspace uses, so aws-lc (C)
# stays out of the build.
aws-smithy-types = "1"
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
bytes = "1"
arc-swap = "1"
async-graphql = "7.2"
async-graphql-axum = "7.2"
axum = "0.8"
cedar-policy = "4.13"
http-body-util = "0.1"
# rustls with ring: aws-lc-rs needs CMake, which the hermetic Bazel toolchain doesn't have.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
clickhouse = { version = "0.15", features = ["chrono", "uuid"] }
ciborium = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
getrandom = "0.3"
hmac = "0.12"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
prost = "0.14"
prost-types = "0.14"
protox = "0.10"
rmcp = { version = "3.5", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
rskafka = { version = "0.6", default-features = false }
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower-http = { version = "0.7", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v7"] }

awzy-challenge = { path = "authz/services/challenge" }
awzy-clickhouse = { path = "authz/jobs/clickhouse-migrate" }
awzy-cloud = { path = "libs/cloud" }
awzy-context = { path = "authz/services/context" }
awzy-gateway = { path = "authz/services/gateway" }
awzy-heartbeat = { path = "libs/heartbeat" }
awzy-portal = { path = "libs/portal" }
awzy-registry = { path = "portals/corp/registry" }
awzy-activity = { path = "authz/libs/activity" }
awzy-authz-proto = { path = "authz/libs/proto" }
awzy-llm = { path = "libs/llm" }
awzy-identity = { path = "authz/libs/identity" }
awzy-intake = { path = "authz/services/intake" }
awzy-model = { path = "libs/model" }
awzy-pdp = { path = "authz/services/pdp" }
awzy-reasoner = { path = "authz/services/reasoner" }
awzy-synthetic = { path = "authz/demo/synthetic" }
awzy-dev-idp = { path = "tools/dev-idp" }
awzy-server = { path = "libs/server" }
awzy-signing = { path = "authz/libs/signing" }
awzy-classify = { path = "authz/libs/classify" }
awzy-service-auth = { path = "authz/libs/service-auth" }
awzy-store = { path = "libs/store" }
awzy-telemetry = { path = "libs/telemetry" }
