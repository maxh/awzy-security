name: ci

on:
  push:
    branches: [main]
  pull_request:
  # fix-prs.yml and repin-prs.yml start CI this way after pushing to a PR's branch, since
  # pushes made with the workflow token don't trigger runs.
  workflow_dispatch:

# A newer push to the same PR cancels the run it replaces. Each commit on main gets its own
# group, so its run is never cancelled or replaced: every commit is tested and publishes its
# images and chart, which are tagged by commit and don't conflict. Deploys are throttled
# separately (the deploy-corp job).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the change touches anything but docs. A pull request that only edits Markdown,
  # docs/, or the agent skills skips the other jobs, which then count as passed. Pushes to
  # main always run everything, so every commit on main publishes.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # A file counts as code if it matches every pattern, so is none of these.
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!.agents/**'
              - '!.claude/**'

  # Six jobs in parallel, so a run takes as long as the slowest. All six must pass.

  # The protobuf APIs SDKs and enforcement points build on (ADR 0045): buf lint and format,
  # and on pull requests no breaking change against main, to generated code or the wire.
  proto:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buf breaking compares with origin/main
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - run: buf format --diff --exit-code
      - if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#ref=origin/main,subdir=authz/libs/proto"

  # oxlint (type-aware, on tsgo) and oxfmt over the portals' TypeScript. Type checks
  # themselves run under Bazel (the :typecheck tests).
  lint-ts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # How much of the frontends the unit tests cover, on the run's summary page (#226). The
      # tests themselves also run in Bazel; this is only the report.
      - name: Frontend test coverage
        run: |
          pnpm -r --if-present coverage | tee coverage.txt
          # pnpm prefixes each line with its package: keep that, drop the rest.
          { echo '### Frontend test coverage'; echo '```'
            grep -E ' coverage: (Statements|Branches|Functions|Lines) ' coverage.txt || echo "no coverage summary"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The P models of protocols between services (ADR 0126): each property, over a few thousand
  # schedules, and each bug a model found put back, which must break its property. A failure
  # prints the trace that broke it. p-models-nightly.yml runs many more schedules.
  p-models:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the drift warning compares with the pull request's base
      - name: Models changed with their code
        if: github.event_name == 'pull_request'
        run: tools/ci/check-p-drift.sh "${{ github.event.pull_request.base.sha }}"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool install --global P --version 3.1.0
      - run: tools/ci/check-p-models.sh

  # What the dependencies are (#430): cargo-deny's licenses, bans, and sources (deny.toml), which
  # only a change here can break, and npm's advisories for what the portals ship. Rust advisories
  # are reported but don't fail a pull request, since a new one can land against any commit;
  # supply-chain.yml fails on them daily.
  supply-chain:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, "bans licenses sources"]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
      - if: matrix.checks != 'advisories'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: matrix.checks != 'advisories'
        run: corepack enable && pnpm audit --prod

  # Clippy and rustfmt over every Rust target; any warning fails.
  lint-rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-api-key: ${{ secrets.AWZY_CORP_BUILDBUDDY_API_KEY }}
      - run: bazel build --config=ci --config=ci-check --config=lint //...
      - name: Disk use
        if: always()
        run: df -h /

  # Tests everything, and on main publishes on the same runner. Images are optimized builds
  # (--config=release), so publishing compiles again; the remote cache keeps that to what changed.
  bazel:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC token for AWS; only main can assume the publish role
      contents: read
    # Where releases go, from the repository's Actions variables (deploy/terraform/corp/build's
    # outputs). A fork without them tests everything and skips publishing.
    env:
      AWS_REGION: ${{ vars.AWZY_CORP_AWS_REGION }} # the name the AWS CLI reads
      # Two releases from each commit (ADR 0053), to the same registry for now.
      AWZY_AUTHZ_RELEASE_COSIGN_KEY: ${{ vars.AWZY_CORP_COSIGN_KEY }}
      # publish-images.sh authz writes each image's digest here; publish-chart.sh puts them in the chart.
      AWZY_AUTHZ_RELEASE_DIGESTS: /tmp/awzy-authz-digests.yaml
      AWZY_AUTHZ_RELEASE_REGISTRY: ${{ vars.AWZY_CORP_RELEASE_REGISTRY }}
      AWZY_AUTHZ_RELEASE_TAG: ${{ github.sha }}
      AWZY_CI_PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWZY_CORP_RELEASE_REGISTRY != '' }}
      AWZY_CORP_PORTAL_RELEASE_COSIGN_KEY: ${{ vars.AWZY_CORP_COSIGN_KEY }}
      AWZY_CORP_PORTAL_RELEASE_REGISTRY: ${{ vars.AWZY_CORP_RELEASE_REGISTRY }}
      AWZY_CORP_PORTAL_RELEASE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the quality ratchets compare with where this branch meets main
      - uses: azure/setup-helm@v5
      # The awzy chart and bootstrap's config chart render with example values.
      - name: Lint charts
        run: |
          helm lint --strict deploy/helm/awzy -f deploy/helm/awzy/values-example.yaml
          helm template awzy deploy/helm/awzy -f deploy/helm/awzy/values-example.yaml > /dev/null
          helm lint --strict deploy/terraform/bootstrap/charts/awzy-config -f deploy/terraform/bootstrap/charts/awzy-config/values-example.yaml
      # What helm lint can't check: the chart as a Kubernetes API server reads it, admission
      # policies' CEL above all (kind is on the runner image).
      - name: Chart against the Kubernetes API
        run: tools/ci/check-chart-api.sh
      # Every Terraform directory is formatted and valid, and root modules' lock files are current.
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: Terraform is valid
        run: tools/ci/check-terraform.sh
      # A release needs exactly the bootstrap level the same commit provides (ADR 0098).
      - name: Bootstrap level matches the chart
        run: tools/ci/check-bootstrap-level.sh
      # Every image the chart runs is awzy's or a listed, mirrored one (ADR 0057).
      - name: Chart images are mirrored
        run: tools/ci/mirror-images.sh --check
      # New migrations only expand, so the version still running during a rollout keeps working
      # (ADR 0072).
      - name: Migrations only expand
        run: tools/ci/check-migrations.sh
      # One word for each thing (ADR 0074, 0079): human, principal, enforcement point.
      - name: Names stay consistent
        run: tools/ci/check-names.sh
      # Each ADR has its own number, so a citation names one decision.
      - name: ADR numbers are unique
        run: tools/ci/check-adr-numbers.sh
      # Every alert links the section of the docs that says what to do about it.
      - name: Alerts link their runbooks
        run: tools/ci/check-alert-runbooks.sh
      # The rules load in Prometheus itself, the local stack's version: a duplicate key or a bad
      # expression otherwise surfaces only when an install's monitoring is applied.
      - name: Alert rules load in Prometheus
        run: >-
          docker run --rm -v "$PWD/deploy/observability/prometheus:/rules:ro" --entrypoint promtool
          prom/prometheus:v3.5.0 check rules /rules/alerts.yaml
      # What the code-quality pass removed stays removed, and what's left only shrinks (#221 to
      # #227).
      - name: Code quality ratchets
        run: tools/ci/check-quality-ratchets.sh
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-api-key: ${{ secrets.AWZY_CORP_BUILDBUDDY_API_KEY }}
      # The same Postgres, ClickHouse, Kafka, and Valkey as local development, so the
      # database tests run here instead of skipping.
      - name: Start the local stack
        run: docker compose -f deploy/local/compose.yaml up -d --wait
      # Each Postgres database's schema.sql matches its migrations (tools/db-schema).
      - name: Database schemas are current
        run: tools/db-schema --check
      - run: bazel test --config=ci --config=ci-check --config=local-stack //...
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/local/compose.yaml logs --tail=200

      # Every push to main publishes signed images and the chart to the build account's ECR
      # (deploy/terraform/corp/build).
      - if: env.AWZY_CI_PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWZY_CORP_AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWZY_CORP_AWS_REGION }}
      - if: env.AWZY_CI_PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - if: env.AWZY_CI_PUBLISH == 'true'
        uses: sigstore/cosign-installer@v3
      # Each image's SBOM, and the release's (ADR 0093).
      - if: env.AWZY_CI_PUBLISH == 'true'
        uses: anchore/sbom-action/download-syft@v0
      - name: Publish the authz release's images
        if: env.AWZY_CI_PUBLISH == 'true'
        run: tools/ci/publish-images.sh authz
      - if: env.AWZY_CI_PUBLISH == 'true'
        uses: imjasonh/setup-crane@v0.7
      # Third-party images installs run, copied from upstream and signed (ADR 0057).
      - name: Mirror third-party images
        if: env.AWZY_CI_PUBLISH == 'true'
        run: tools/ci/mirror-images.sh
      - name: Publish the authz release's chart
        if: env.AWZY_CI_PUBLISH == 'true'
        run: tools/ci/publish-chart.sh
      - name: Publish the corp portal release's images
        if: env.AWZY_CI_PUBLISH == 'true'
        run: tools/ci/publish-images.sh corp-portal
      # How much room the build left, to know whether freeing disk is still needed.
      - name: Disk use
        if: always()
        run: df -h /

  # Deploys the corp portal and the registry proxy (deploy/terraform/corp/corp-portal) once
  # this commit's images are published. One deploy runs at a time. A deploy waiting behind
  # another is replaced by a newer one, so a burst of merges deploys the first and the last,
  # and deploy-corp.sh never replaces a newer commit with an older one.
  deploy-corp:
    needs: bazel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWZY_CORP_AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-corp
      cancel-in-progress: false
    permissions:
      id-token: write # GitHub OIDC token for AWS; only main can assume the deploy role
      contents: read
    env:
      AWZY_CORP_PORTAL_RELEASE_REGISTRY: ${{ vars.AWZY_CORP_RELEASE_REGISTRY }}
      AWZY_CORP_PORTAL_RELEASE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # deploy-corp.sh compares this commit with the deployed one
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWZY_CORP_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWZY_CORP_AWS_REGION }}
      - name: Deploy corp portal and registry
        run: tools/ci/deploy-corp.sh
