name: terraform-corp

# Corp Terraform in the build account (ADR 0115, tools/ci/terraform-corp.sh): a pull request that
# changes it gets a comment listing what merging would change; after merge, the apply waits in the
# corp-terraform environment for a person's approval, then applies. corp/state and corp/org, in
# the management account, stay with a person (deploy/terraform/corp/README.md).
on:
  pull_request:
    paths:
      - "deploy/terraform/corp/build/**"
      - "deploy/terraform/corp/corp-portal/**"
      - "deploy/terraform/corp/variables.tf"
      - "tools/ci/terraform-corp.sh"
      - "tools/ci/terraform-env.sh"
      - ".github/workflows/terraform-corp.yml"
  push:
    branches: [main]
    paths:
      - "deploy/terraform/corp/build/**"
      - "deploy/terraform/corp/corp-portal/**"
      - "deploy/terraform/corp/variables.tf"
  workflow_dispatch:

# One plan or apply at a time; an apply already running finishes.
concurrency:
  group: terraform-corp-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # Pull requests from forks get no OIDC token, and only once the roles exist.
    if: >-
      github.event_name == 'pull_request' && vars.AWZY_CORP_AWS_PLAN_ROLE_ARN != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWZY_CORP_AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWZY_CORP_AWS_REGION }}
      - name: What merging changes
        env:
          DEPLOYMENT_ENV: ${{ secrets.AWZY_CORP_DEPLOYMENT_ENV }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: tools/ci/terraform-corp.sh plan corp/build corp/corp-portal

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWZY_CORP_AWS_TERRAFORM_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: corp-terraform
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWZY_CORP_AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWZY_CORP_AWS_REGION }}
      - name: Apply
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.AWZY_CORP_CLOUDFLARE_TOKEN }}
          DEPLOYMENT_ENV: ${{ secrets.AWZY_CORP_DEPLOYMENT_ENV }}
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/terraform-corp.sh apply corp/build corp/corp-portal
