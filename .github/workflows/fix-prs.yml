name: fix-prs

# Makes each pull request's mechanical fixes and pushes them to its branch
# (tools/ci/fix-pr.sh): re-pinned lockfiles, regenerated GraphQL schemas and Relay artifacts,
# and rustfmt and oxfmt on the files it changed. So none of them needs Bazel locally.
# Pull requests from forks are skipped: the workflow token can't push to them.
# The paths are what tools/ci/fix-pr.sh can fix, so a docs-only PR doesn't set up Bazel.
on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "cargo-bazel-lock.json"
      - "MODULE.bazel"
      - "libs/model/**"
      - "libs/portal/**"
      - "portals/**"

# One run per branch; a newer push replaces a run still going.
concurrency:
  group: fix-prs-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the fixes to the PR's branch
      actions: write # start the PR's CI, which the workflow token's push doesn't
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0 # the merge base with main says what the PR changed
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-api-key: ${{ secrets.AWZY_CORP_BUILDBUDDY_API_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: tools/ci/fix-pr.sh
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
