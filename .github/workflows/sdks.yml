name: sdks

# Each client library's own linters (ADR 0114), as oxlint is for TypeScript. Their tests, the shared
# conformance spec among them, run in Bazel with everything else.
on:
  pull_request:
    paths:
      - "authz/sdks/**"
      - ".github/workflows/sdks.yml"
  push:
    branches: [main]
    paths:
      - "authz/sdks/**"
      - ".github/workflows/sdks.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authz/sdks/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authz/sdks/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: authz/sdks/go/go.mod
          cache-dependency-path: authz/sdks/go/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
