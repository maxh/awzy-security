name: docs-site

# https://docs.awzysecurity.com (docs/site): builds on every pull request that touches it, and
# deploys main to its S3 bucket behind CloudFront (deploy/terraform/corp/corp-portal/docs-site.tf)
# with the corp deploy role, through GitHub's OIDC token: no stored credential.
on:
  pull_request:
    paths:
      - "docs/site/**"
      - "INSTALL.md"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "INSTALL.md"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for AWS; only main can assume the deploy role
    env:
      DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWZY_CORP_DOCS_BUCKET != '' }}
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      # Not part of the portals' pnpm workspace: the site has its own lockfile.
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm --ignore-workspace build
      # Only main, and only once Terraform has made the bucket and distribution.
      - if: env.DEPLOY == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWZY_CORP_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWZY_CORP_AWS_REGION }}
      # Astro names everything under _astro/ by its content hash, so those are cached for good;
      # pages are revalidated, and CloudFront's copy is cleared on every deploy.
      - name: Deploy
        if: env.DEPLOY == 'true'
        run: |
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "_astro/*" --cache-control "public, max-age=0, must-revalidate"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" >/dev/null
          echo "deployed to https://docs.awzysecurity.com"
        env:
          BUCKET: ${{ vars.AWZY_CORP_DOCS_BUCKET }}
          DISTRIBUTION: ${{ vars.AWZY_CORP_DOCS_DISTRIBUTION_ID }}
